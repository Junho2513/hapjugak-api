# /etc/nginx/conf.d/hapjugak-upstream.conf
#
# 이 파일 하나가 「지금 트래픽이 어디로 가는가」입니다.
# deploy.sh 가 배포할 때마다 포트를 바꿔 쓰고 nginx 를 reload 합니다.
#
#   8080 = blue   (hapjugak-api-blue)
#   8081 = green  (hapjugak-api-green)
#
# 사람이 손댈 일은 없습니다. 다만 "지금 어느 쪽이 서비스 중인지" 알고 싶으면
# 이 파일을 보면 됩니다. deploy.sh 도 컨테이너 목록이 아니라 이 파일을 봅니다 —
# 트래픽이 실제로 어디로 가는지가 정답이기 때문입니다.
upstream hapjugak_api {
    server 127.0.0.1:8080;
}
