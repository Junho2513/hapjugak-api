name: 배포

on:
  push:
    branches: [ master ]
  workflow_dispatch:          # 깃허브 화면에서 손으로도 실행 가능

env:
  IMAGE: ghcr.io/junho2513/hapjugak-api

jobs:
  test:
    name: 테스트
    runs-on: ubuntu-latest

    # 동시성 테스트는 진짜 MySQL이 있어야 의미가 있습니다.
    # 인메모리 DB는 락 동작이 달라서 통과해도 증명되는 게 없습니다.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-password
          MYSQL_DATABASE: hapjugak_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - run: chmod +x gradlew

      - name: 테스트 22개
        run: ./gradlew test --no-daemon
        env:
          DB_PASSWORD: ci-password
          # 테스트는 S3를 호출하지 않습니다.
          # 다만 자격 증명이 아예 없으면 SDK가 EC2 메타데이터 주소를 찾아보느라
          # 몇 초씩 지연될 수 있어, 찾을 필요가 없도록 가짜 값을 미리 넣어둡니다.
          AWS_ACCESS_KEY_ID: ci-dummy
          AWS_SECRET_ACCESS_KEY: ci-dummy
          AWS_REGION: ap-southeast-2

  deploy:
    name: 배포
    needs: test               # 테스트가 깨지면 배포하지 않습니다
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # 기본 드라이버는 캐시 내보내기를 지원하지 않습니다.
      # buildx를 먼저 띄워야 cache-to 가 동작합니다.
      - name: buildx 준비
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 및 업로드
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 서버에 SSH로 들어가지 않습니다.
      # 이미 열려 있는 443 포트로 "배포해라" 신호만 보냅니다.
      # CI는 서버 열쇠를 갖지 않고, 실행할 명령을 고를 수도 없습니다.
      - name: 서버에 배포 요청
        run: |
          curl -fsS --retry 3 --retry-delay 5 -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            https://hapjugak.com/deploy-hook