  search.append(inp);
  box.append(search);

  const count = el("div","admin-count mono");
  const list = el("div","admin-list");
  box.append(count, list);

  const paint = () => {
    const q = adminQ.trim().toLowerCase();
    const rows = allEvents
      .filter(e => !q || [e.title,e.region,e.studio,e.hostName,e.genre]
        .some(v => (v||"").toLowerCase().includes(q)))
      .slice().sort((a,b) => (b.date||"").localeCompare(a.date||""));
    count.textContent = `전체 ${allEvents.length}건`;
    list.innerHTML = "";
    if (!rows.length){ list.append(el("div","empty-note","찾는 합주가 없습니다.")); return; }

    const today = todayISO();
    rows.forEach(e => {
      const songs = songsOf(e.id);
      const row = el("div","admin-row");
      const info = el("div","admin-info");
      const head = el("div","admin-name");
      head.append(el("b","",e.title));
      if (e.visibility === "private") head.append(el("span","tagp-mini","비공개"));
      if (e.date && e.date < today) head.append(el("span","tagp-mini","지난 합주"));
      if (e.genre) head.append(el("span","tagp-mini",e.genre));
      info.append(head);
      info.append(el("div","admin-sub",
        `${fmtDate(e.date)} · ${e.region||"지역 미정"} · ${[e.studio,e.room].filter(Boolean).join(" ")||"합주실 미정"} · 주최 ${e.hostName||"—"}`));
      info.append(el("div","admin-sub mono",
        `곡 ${songs.length} · 성립 ${songs.filter(isDone).length} · 편성 미정 ${songs.filter(isUnset).length} · 참가 ${playerCount(songs)}명`));
      row.append(info);

      const acts = el("div","admin-acts");
      const go = document.createElement("a");
      go.className = "btn sm"; go.href = "#/e/" + e.id; go.textContent = "열기";
      acts.append(go);
      const rm = el("button","btn sm ghost","삭제");
      rm.style.color = "var(--danger)";
      rm.onclick = async () => {
        if (!confirm(`"${e.title}" 합주를 삭제할까요?\n\n곡 ${songs.length}개와 잡혀 있는 자리가 모두 사라지며, 되돌릴 수 없습니다.`)) return;
        try {
          /* 곡을 먼저 일정에서 떼어내던 줄이 여기 있었습니다.
             곡이 일정 밖에 떠 있을 수 있던 시절의 순서인데, 지금은 서버가
             일정을 지울 때 그 안의 곡과 자리와 기록을 함께 지웁니다.
             곡은 이제 일정 없이 존재할 수 없어서, 떼어내려 하면 서버가 거절합니다. */
          await store.deleteEvent(e.id);
          toast("합주를 삭제했습니다"); renderAdmin();
        } catch(err){ toast("삭제하지 못했습니다"); }
      };
      acts.append(rm);
      row.append(acts);
      list.append(row);
    });
  };
  paint();
}

function download(name, text, type){
  const url = URL.createObjectURL(new Blob(["\ufeff" + text], {type}));
  const a = document.createElement("a");
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

  c2.append(el("b","","편성 미정 곡"));
  c2.append(el("p","",`아직 파트가 정해지지 않은 곡이 ${emptySongs.length}개 있습니다. 오래 방치되면 아무도 참가할 수 없습니다.`));
  if (emptySongs.length){
    const b2 = document.createElement("a");
    b2.className = "btn sm"; b2.href = "#/e/" + emptySongs[0][0].id;
    b2.textContent = "첫 곡이 있는 합주 열기";
    c2.append(b2);
  }
  clean.append(c2);
  box.append(clean);
}

async function completeEvent(e, on){
  if (!auth.user) return;
  const songs = songsOf(e.id);
  if (on){
    const short = songs.filter(sg => !isDone(sg)).length;
    const msg = `«${e.title}» 합주를 완료로 표시합니다.\n\n` +
      `이 일정의 ${songs.length}곡이 합주 완료로 기록되고, 자리와 곡 정보가 잠깁니다.` +
      (short ? `\n\n아직 자리가 다 안 찬 곡이 ${short}개 있습니다. 그대로 기록할까요?` : "");
    if (!confirm(msg)) return;
  } else {
    const past = e.date && e.date < todayISO();
    if (!confirm("완료 표시를 해제하고 다시 편집할 수 있게 되돌릴까요?" +
      (past ? "\n\n날짜가 이미 지난 합주라, 해제하면 다시 완료로 표시하기 전까지 진행 중으로 남습니다." : ""))) return;
  }
  try {
    await store.updateEvent(e.id, on ? {completed:true, completedAt: Date.now()} : {completed:false});
    toast(on ? "합주 완료로 기록했습니다" : "완료 표시를 해제했습니다");
  } catch(err){
    console.error("합주 완료 저장 실패:", err);
    toast(errText(err));
  }
}

       상태가 됩니다. 눌러둔 사람은 저장됐다고 믿습니다. */
    const 미정칸 = [["#f-date-tbd","#f-date"], ["#f-start-tbd","#f-start"], ["#f-end-tbd","#f-end"],
                   ["#f-region-tbd","#f-region"], ["#f-studio-tbd","#f-studio"]];

      const sync = () => { i.disabled = b.checked; };
      b.onchange = sync;
      sync();

      const end   = 미정이면("#f-end-tbd")   ? "" : root.querySelector("#f-end").value;
      const deadline = root.querySelector("#f-deadline").value;

      if (!title) return err.textContent = "합주 이름을 채워주세요.";

      if (start && end && end <= start) return err.textContent = "종료 시간이 시작 시간보다 빠릅니다.";
      if (deadline && date && deadline > date) return err.textContent = "곡 신청 마감은 합주일보다 늦을 수 없습니다.";
      if (!defaults.size) return err.textContent = "모집 파트를 하나 이상 켜주세요.";

      const base = {
        title, date,
        timeStart: start, timeEnd: end,
        genre: root.querySelector("#f-genre").value,
        region: 미정이면("#f-region-tbd") ? "" : root.querySelector("#f-region").value,
        studio: 미정이면("#f-studio-tbd") ? "" : q("#f-studio"),
        room: q("#f-room"),
        roomCapacity: Number(root.querySelector("#f-cap").value) || null,
        feeAmount: root.querySelector("#f-fee-amount").value,
        feeNote: q("#f-fee-note"),
        entryDeadline: deadline,
        maxSongsPerUser: Number(root.querySelector("#f-maxsongs").value) || 0,
        afterparty: root.querySelector("#f-after").value,
        visibility: root.querySelector("#f-vis").value,
        defaultParts: Object.values(DEFAULT_PART_LABEL).filter(x => defaults.has(x)),
        description: q("#f-desc"),
        tags: q("#f-tags").split(",").map(t => t.trim()).filter(Boolean).slice(0,8),
        cover
      };
      err.textContent = "";
      try {
        if (editing){
          await store.updateEvent(ev.id, base);
          closeModal(); toast("합주 정보를 저장했습니다");
        } else {
          const id = await store.createEvent({...base, hostUid: auth.user.uid, hostName: me().name});
          closeModal(); toast("합주를 열었습니다"); location.hash = "#/e/"+id;
        }
      } catch(e){ console.error(e); err.textContent = errText(e); }
    };
  });
}

let manageMode = false;
/* 남의 자리를 빼거나 옮기거나 넣는 자리 관리는 관리자만 합니다. */
const canManageSlots = () => !!auth.user && isAdmin();
/* 지금 보고 있는 일정의 주최자인지 (마감 뒤에도 자기 일정은 손볼 수 있게) */
const isEventHost = () => !!auth.user && !!curEvent && curEvent.hostUid === auth.user.uid;

/* 이 합주에 이미 참여 중인 사람들을 모읍니다. 주최자는 회원 전체 목록을
   볼 권한이 없으므로, 참가자 명단과 직접 입력으로 자리를 채웁니다. */
function eventPeople(){
  const m = new Map();
  (curEvent ? curSongs : allSongs).forEach(sg => Object.values(sg.slots||{}).forEach(v => {
    if (v && !m.has(v.uid)) m.set(v.uid, {uid:v.uid, name:v.name});
  }));
  return [...m.values()].sort((a,b) => a.name.localeCompare(b.name,"ko"));
}

function slotAdminModal(song, part){
  const cur = song.slots?.[part] || null;
  const people = eventPeople().filter(p => !cur || p.uid !== cur.uid);

  modal(`
    <h3>${esc(part)} 자리 관리</h3>
    <p class="hint">${esc(song.title)}${cur ? ` — 지금은 ${esc(cur.name)} 님이 맡고 있습니다.` : " — 지금은 비어 있습니다."}</p>
    ${people.length ? `<div class="field"><label>이 합주 참가자</label><div class="partpick" id="sa-people"></div></div>` : ""}
    ${isAdmin() ? `<div class="field"><label>가입 회원 전체</label><div class="partpick" id="sa-members"><span class="ava-note">불러오는 중</span></div></div>` : ""}
    <div class="field"><label>직접 넣기</label>
      <input id="sa-name" maxlength="20" placeholder="이름을 적어 바로 넣기">
      <p class="ava-note">가입하지 않은 사람도 자리에 넣을 수 있습니다. 본인이 직접 취소할 수는 없고, 주최자만 뺄 수 있습니다.</p></div>
    <div class="err" id="sa-err"></div>
    <div class="modal-actions">
      ${cur ? `<button class="btn ghost" id="sa-clear" style="margin-right:auto;color:var(--danger)">자리 비우기</button>` : ""}
      <button class="btn ghost" id="sa-cancel">닫기</button>
      <button class="btn primary" id="sa-save">넣기</button>
    </div>`, root => {

    let picked = null;
    const nameInput = root.querySelector("#sa-name");
    const err = root.querySelector("#sa-err");

    if (isAdmin()){
      const mbox = root.querySelector("#sa-members");
      store.listUsers().then(users => {
        const known = new Set(people.map(p => p.uid));
        const rest = users.filter(u => u.uid !== cur?.uid && !known.has(u.uid))
          .sort((a,b) => (a.name||"").localeCompare(b.name||"","ko"));
        if (!rest.length){ mbox.closest(".field").remove(); return; }
        mbox.innerHTML = "";
        rest.forEach(u => {
          const b = el("button","",u.name || "이름없음"); b.type = "button";
          b.onclick = () => {
            picked = (picked && picked.uid === u.uid) ? null : {uid:u.uid, name:u.name};
            root.querySelectorAll("#sa-people button, #sa-members button").forEach(n =>
              n.classList.toggle("on", !!picked && n === b));
            if (picked) nameInput.value = "";
          };
          mbox.append(b);
        });
      }).catch(() => mbox.closest(".field")?.remove());
    }

    root.querySelectorAll("#sa-people")?.forEach(() => {});
    const pbox = root.querySelector("#sa-people");
    if (pbox){
      people.forEach(pr => {
        const b = el("button","",pr.name); b.type = "button";
        b.onclick = () => {
          picked = (picked && picked.uid === pr.uid) ? null : pr;
          root.querySelectorAll("#sa-people button, #sa-members button").forEach(n =>
            n.classList.toggle("on", !!picked && n === b));
          if (picked) nameInput.value = "";
        };
        pbox.append(b);
      });
    }
    nameInput.oninput = () => {
      if (nameInput.value.trim()){
        picked = null;
        pbox?.querySelectorAll("button").forEach(n => n.classList.remove("on"));
      }
    };

    const apply = async person => {
      try {
        await store.setSlot(song.id, part, person);
        logIt(song.id, person ? "admin_assign" : "admin_clear",
          {songTitle: song.title, part, targetName: person ? person.name : (cur?.name || "")});
        closeModal();
        toast(person ? `${person.name} 님을 ${part}에 넣었습니다` : `${part} 자리를 비웠습니다`);
      } catch(e){ console.error(e); err.textContent = errText(e); }
    };

    root.querySelector("#sa-cancel").onclick = closeModal;
    root.querySelector("#sa-clear")?.addEventListener("click", () => apply(null));
    root.querySelector("#sa-save").onclick = () => {
      const typed = nameInput.value.trim();
      if (!picked && !typed) return err.textContent = "참가자를 고르거나 이름을 적어주세요.";
      const person = picked || {uid: "guest:" + Date.now().toString(36), name: typed};
      const held = heldInstrument(song.slots, part, person.uid);
      if (held && !confirm(`${person.name} 님은 이 곡에서 이미 ${held}을 맡고 있습니다.\n한 곡에 악기 두 개를 맡기게 되는데, 그대로 넣을까요?`)) return;
      apply(person);
    };
  });
}

/* 곡이 배정된 일정의 주최자인지 */
function hostOfSong(song){
  if (!auth.user || !song.eventId) return false;
  const ev = allEvents.find(e => e.id === song.eventId);
  return !!ev && ev.hostUid === auth.user.uid;
}

/* 곡 편집 권한
   - 관리자: 모든 곡
   - 곡을 올린 본인: 자기 곡
   - 일정 주최자: 자기 일정에 들어온 곡 (곡 정보만, 삭제는 불가) */
function canEditSong(song){
  if (!auth.user) return false;
  return isAdmin() || song.proposerUid === auth.user.uid || hostOfSong(song);
}
function canDeleteSong(song){
  if (!auth.user) return false;
  return isAdmin() || song.proposerUid === auth.user.uid;
}

function songModal(song){
  if (!requireLogin()) return;
  const editing = !!song;
  /* 새 곡은 반드시 어느 합주의 곡입니다. 상세 화면 안에서만 올릴 수 있습니다. */
  if (!editing && !curEvent){
    toast("합주 일정에 들어가서 곡을 올려주세요");
    return;
  }
  if (editing && !canEditSong(song)){ toast("곡을 올린 본인, 그 일정의 주최자, 관리자만 편집할 수 있습니다"); return; }
  if (closedForMe()){
    toast(closedMsg("곡을 바꿀 수 없습니다"));
    return;
  }
  if (!passDeadline(editing ? "곡 편집을" : "곡 추가를")) return;

  modal(`
    <h3>${editing ? "곡 편집" : "곡 올리기"}</h3>
    <p class="hint">${editing ? "" : `«${esc(curEvent.title)}»에 올립니다. `}이 곡에 필요한 자리만 만들어 두세요. 만들지 않은 자리는 모집하지 않습니다. 올린 뒤에도 편집으로 언제든 고칠 수 있습니다.</p>
    <div class="field"><label>곡 제목</label>
      <input id="s-title" placeholder="예: Creep" maxlength="80" value="${esc(song?.title || "")}"></div>
    <div class="field"><label>아티스트</label>
      <input id="s-artist" placeholder="예: Radiohead" maxlength="80" value="${esc(song?.artist || "")}"></div>
    <div class="field"><label>유튜브 링크</label>
      <input id="s-yt" placeholder="https://youtu.be/..." maxlength="200" value="${esc(song?.youtube || "")}">
      <p class="ava-note">참가자가 원곡을 바로 듣고 파트를 정할 수 있습니다. 비워둬도 됩니다.</p></div>
    <div class="field"><label>설명</label>
      <textarea id="s-desc" maxlength="500" placeholder="키 조정, 원곡 대비 편곡, 난이도, 참고 영상 등">${esc(song?.description || "")}</textarea></div>
    <div class="field"><label>필요한 자리</label>
      <div id="s-parts"></div>
      <label class="unset-toggle"><input type="checkbox" id="s-unset"${editing && !(song.requiredParts||[]).length ? " checked" : ""}>
        <span>편성을 잘 모르겠어요 — 나중에 채우기</span></label>
      <p class="ava-note">모르면 체크하고 넘어가세요. 곡은 그대로 올라가고, 편성을 아는 분이 대신 채워줍니다.${editing ? " 파트를 끄면 그 자리에 들어와 있던 사람도 함께 빠집니다." : ""}</p></div>
    <div class="err" id="s-err"></div>
    <div class="modal-actions">
      ${editing && canDeleteSong(song) ? '<button class="btn ghost" id="s-del" style="margin-right:auto;color:var(--danger)">삭제</button>' : ''}
      <button class="btn ghost" id="s-cancel">취소</button>
      <button class="btn primary" id="s-save">${editing ? "저장하기" : "올리기"}</button>
    </div>`, root => {

    const pick = partPicker(song?.requiredParts || defaultPartsOf(curEvent));
    root.querySelector("#s-parts").append(pick.el);

    const unsetBox = root.querySelector("#s-unset");
    const syncUnset = () => pick.setDisabled(unsetBox.checked);
    unsetBox.onchange = syncUnset;
    syncUnset();

    root.querySelector("#s-cancel").onclick = closeModal;

    root.querySelector("#s-del")?.addEventListener("click", async () => {
      if (!confirm(`"${song.title}" 곡을 삭제할까요? 이 곡에 잡힌 자리도 함께 사라집니다.`)) return;
      try {
        await store.deleteSong(song.id);
        logIt(song.id, "song_delete", {songTitle: song.title});
        closeModal(); toast("곡을 삭제했습니다");
      }
      catch(e){ root.querySelector("#s-err").textContent = "삭제하지 못했습니다."; }
    });

    root.querySelector("#s-save").onclick = async () => {
      const err = root.querySelector("#s-err");
      const title = root.querySelector("#s-title").value.trim();
      const yt = root.querySelector("#s-yt").value.trim();
      if (!title) return err.textContent = "곡 제목을 적어주세요.";
      const unset = root.querySelector("#s-unset").checked;
      if (!unset && !pick.get().length)
        return err.textContent = "자리를 하나 이상 만들거나, 아래 '편성을 잘 모르겠어요'를 눌러주세요.";
      if (yt && !/^https?:\/\/(www\.|m\.|music\.)?(youtube\.com|youtu\.be)\//i.test(yt))
        return err.textContent = "유튜브 주소를 확인해 주세요. 비워두셔도 됩니다.";

      const requiredParts = unset ? [] : pick.get();
      const base = {
        title,
        artist: root.querySelector("#s-artist").value.trim(),
        description: root.querySelector("#s-desc").value.trim(),
        youtube: yt, requiredParts
      };
      err.textContent = "";
      try {
        if (editing){
          // 더 이상 모집하지 않는 파트에 남아 있던 사람은 함께 비웁니다.
          const slots = {...(song.slots||{})};
          Object.keys(slots).forEach(k => { if (!requiredParts.includes(k)) delete slots[k]; });
          await store.updateSong(song.id, {...base, slots});
          logIt(song.id, "song_edit", {songTitle: title});
          toast("곡을 저장했습니다");
        } else {
          const newId = await store.addSong({...base, eventId: curEvent.id, slots:{}, proposerUid: auth.user.uid, proposerName: me().name});
          logIt(newId, "song_add", {songTitle: title});
          toast("곡을 올렸습니다");
        }
        closeModal();
      } catch(e){ console.error(e); err.textContent = errText(e); }
    };
  });
}

function showGuide(kind){
  const g = GUIDES[kind];
  if (!g){ location.hash = "#/guide"; return; }
  const box = $("#guide-body");
  box.innerHTML = "";

  const nav = el("div","guide-nav");
  const other = kind === "host" ? "join" : "host";
  const a1 = document.createElement("a"); a1.href = "#/guide"; a1.className = "chip"; a1.textContent = "사용법 처음으로";
  const a2 = document.createElement("a"); a2.href = "#/guide/" + other; a2.className = "chip"; a2.textContent = GUIDES[other].title;
  nav.append(a1, a2);
  box.append(nav);

  box.append(el("h1","guide-h1",g.title));
  box.append(el("p","guide-lead",g.lead));

  const steps = el("div","guide-steps");
  g.steps.forEach(([t, body], i) => {
    const st = el("div","guide-step");
    const head = el("div","guide-step-head");
    head.append(el("span","guide-num", "STEP " + (i+1)));
    head.append(el("h2","",t));
    st.append(head);
    st.append(el("p","",body));
    steps.append(st);
    if (i < g.steps.length - 1) steps.append(el("div","guide-arrow","▼"));
  });
  box.append(steps);

  const end = el("div","guide-end");
  const go = document.createElement("a");
  go.className = kind === "host" ? "btn primary big" : "btn cyan big";
  go.href = "#/";
  go.textContent = kind === "host" ? "합주 열러 가기" : "합주 둘러보러 가기";
  end.append(go);
  box.append(end);

  document.title = g.title + " — 합주각";
  window.scrollTo(0,0);
}

function route(){
  const h = location.hash;
  /* #/e/7              공개 일정
     #/e/7/Kx3f9_aQ2LmP   비공개 일정 — 뒤에 붙는 것이 초대 키
     키를 주소에 넣는 이유는 링크 하나만 건네면 끝나게 하려는 것입니다.
     받은 사람이 키를 따로 입력해야 한다면 아무도 안 씁니다. */
  const m = h.match(/^#\/e\/([^/?]+)(?:\/([A-Za-z0-9_-]+))?$/);
  if (m){ openEvent(m[1], m[2] || null); return; }

  if (curEvent) closeEvent();

  if (h === "#/memories"){ showView("memories"); renderMemories(); window.scrollTo(0,0); return; }
  // 곡 후보 화면은 없어졌습니다. 예전 링크나 북마크를 들고 온 사람을 첫 화면으로 보냅니다.
  if (h === "#/songs"){ location.replace("#/"); return; }
  if (h === "#/admin"){ openAdmin(); return; }
  if (h === "#/guide"){ showView("guide"); showGuideMenu(); window.scrollTo(0,0); return; }
  if (h === "#/guide/host" || h === "#/guide/join"){
    showView("guide"); showGuide(h.split("/").pop()); return;
  }

  showView("list");
  document.title = "합주각 — 곡별로 파트 모아서 합주하기";
  if (h === "" || h === "#/") window.scrollTo(0,0);
}

/* ---------- 화면 밝기 ----------
   고르지 않았으면 기기 설정을 따릅니다(토큰의 prefers-color-scheme).
   한 번 고르면 그 선택을 기억하고, 기기 설정보다 우선합니다.
   html 의 data-theme 하나만 바꾸면 색은 토큰이 알아서 따라옵니다. */
const THEME_KEY = "hapjugak.theme";
function readTheme(){
  try { return localStorage.getItem(THEME_KEY) || ""; } catch(e){ return ""; }
}
function systemDark(){
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function applyTheme(mode){
  const root = document.documentElement;
  if (mode) root.setAttribute("data-theme", mode);
  else root.removeAttribute("data-theme");
  const dark = mode ? mode === "dark" : systemDark();
  const b = $("#theme-toggle");
  if (b){
    b.innerHTML = dark
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M4.2 12H2M22 12h-2.2M6.3 6.3 4.8 4.8M19.2 19.2l-1.5-1.5M17.7 6.3l1.5-1.5M4.8 19.2l1.5-1.5"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 13.5A8.5 8.5 0 1 1 10.5 4a6.8 6.8 0 0 0 9.5 9.5Z"/></svg>';
    b.title = dark ? "밝은 화면으로" : "어두운 화면으로";
  }
}
/* 고른 적이 없으면 밝은 화면으로 시작합니다. 기기 설정을 따라가지 않습니다. */
applyTheme(readTheme() || "light");
$("#theme-toggle").onclick = () => {
  const now = readTheme() || "light";
  const next = now === "dark" ? "light" : "dark";
  try { localStorage.setItem(THEME_KEY, next); } catch(e){ /* 저장이 막혀도 이번 세션에는 적용됩니다 */ }
  applyTheme(next);
};

$("#build-tag").textContent = BUILD;
route();

</script>
</body>
