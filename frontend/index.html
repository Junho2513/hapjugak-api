  /* ----- 합주 일정 ----- */
  watchEvents(cb){
    subs.events.add(cb);
    queueMicrotask(() => cb(cacheEvents.map(e => ({...e}))));
    refreshEvents();
    startStream();
    return () => subs.events.delete(cb);
  },
  /* 목록 캐시에서 찾지 않고 단건 주소로 직접 읽습니다. 두 가지 이유가 있습니다.

     1) 링크를 받고 처음 들어온 사람은 목록이 아직 안 받아진 상태입니다.
        캐시만 보면 "없는 일정"으로 오해해 첫 화면으로 튕겨냅니다.
        정작 링크로 들어온 사람이 늘 이 경우라 아무도 링크를 못 열었습니다.

     2) 비공개 일정은 목록에 아예 안 실립니다(그게 비공개의 뜻입니다).
        캐시만 보면 「링크로만 참가」가 영원히 작동하지 않습니다.
        단건 조회는 그래서 일부러 열어둔 주소입니다. */
  watchEvent(id, inviteKey, cb){
    const key = String(id);
    const q = inviteKey ? ("?key=" + encodeURIComponent(inviteKey)) : "";
    if (!subs.one.has(key)) subs.one.set(key, new Set());
    subs.one.get(key).add(cb);
    if (inviteKey) subs.oneKey.set(key, inviteKey);

    const cached = cacheEvents.find(e => e.id === key) || null;
    if (cached) queueMicrotask(() => cb({...cached}));

    call("GET", "/events/" + key + q)
      .then(e => cb(toUiEvent(e)))
      // 잠깐 끊긴 것과 없어진 것은 다릅니다. 없어졌을 때만 내보냅니다.
      .catch(err => { if (!cached && err && err.status === 404) cb(null); });

    refreshEvents();
    startStream();
    return () => {
      const set = subs.one.get(key);
      if (set){ set.delete(cb); if (!set.size){ subs.one.delete(key); subs.oneKey.delete(key); } }
    };
  },
  async createEvent(data){
    const created = await call("POST", "/events", toApiEvent(data));
    await refreshEvents();
    return String(created.id);
  },
  async updateEvent(id, patch){
    await call("PATCH", "/events/" + id, toApiEvent(patch));
    await refreshEvents();
  },
  async deleteEvent(id){
    await call("DELETE", "/events/" + id);
    await refreshAll();
  },

  /* ----- 곡 ----- */
  watchSongs(cb){
    subs.songs.add(cb);
    queueMicrotask(() => cb(cacheSongs.map(s => ({...s}))));
    refreshSongs();
    startStream();
    return () => subs.songs.delete(cb);
  },
  /* 곡은 반드시 합주 일정 안에 올립니다.
     전에는 POST /songs 로 떠다니는 곡을 만들고 PATCH 로 일정에 끼워 넣었습니다.
     두 번 부르는 사이에 하나만 성공하면 주인 없는 곡이 남았습니다. 이제 한 번에 끝납니다. */
  async addSong(song){
    if (!song.eventId) throw new Error("합주 일정을 먼저 고른 뒤에 곡을 올려주세요");
    const created = await call("POST", `/events/${song.eventId}/songs`, {
      title: song.title,
      artist: song.artist || null,
      youtubeUrl: song.youtube || null,
      description: song.description || null,
      parts: (song.requiredParts || []).map(p => String(p).trim()).filter(Boolean)
    });
    await refreshSongs();
    return String(created.id);
  },
  async updateSong(songId, patch){
    /* 다른 일정으로 옮기는 것은 전용 주소가 따로 있습니다.
       빼내기는 없습니다 — 곡은 반드시 어느 일정 안에 있습니다. */
    if (has(patch, "eventId") && patch.eventId){
      await call("PATCH", `/songs/${songId}/event/${patch.eventId}`);
    }
    const body = {};
    if (has(patch, "title")) body.title = patch.title;
    if (has(patch, "artist")) body.artist = patch.artist;
    if (has(patch, "youtube")) body.youtubeUrl = patch.youtube;
    if (has(patch, "description")) body.description = patch.description;
    if (has(patch, "requiredParts"))
      body.parts = (patch.requiredParts || []).map(p => String(p).trim()).filter(Boolean);
    /* patch.slots 는 무시합니다. 편성에서 빠진 파트의 자리는 서버가 함께 정리합니다. */
    if (Object.keys(body).length) await call("PATCH", "/songs/" + songId, body);
    await refreshSongs();
  },
  async deleteSong(songId){
    await call("DELETE", "/songs/" + songId);
    await refreshSongs();
  },

  /* ----- 파트 자리 ----- */
  async setSlot(songId, part, person){
    const slotId = slotIdOf(songId, part);
    await call("PUT", `/songs/${songId}/slots/${slotId}`, {
      memberId: person ? Number(person.uid) : null,
      openToHandover: person ? !!person.open : false
    });
    await refreshSongs();
  },
  async enterSlot(songId, part, person, open){
    const song = cacheSongs.find(s => s.id === String(songId));
    if (!song) throw new Error("삭제된 곡입니다");
    const slotId = slotIdOf(songId, part);
    const cur = song.slots[part];

    if (cur && cur.uid !== person.uid && !cur.open)
      throw new Error("방금 다른 분이 들어갔습니다");
    if (!cur || cur.uid !== person.uid){
      const held = heldInstrument(song.slots, part, person.uid);
      if (held) throw new Error(`이미 ${held} 자리에 있습니다. ${held}을 먼저 취소해 주세요`);
    }

    if (cur && cur.uid === person.uid){
      await call("PATCH", `/songs/${songId}/slots/${slotId}/handover`, { openToHandover: !!open });
    } else if (cur){
      await call("POST", `/songs/${songId}/slots/${slotId}/takeover`);
      if (open) await call("PATCH", `/songs/${songId}/slots/${slotId}/handover`, { openToHandover: true });
    } else {
      await call("POST", `/songs/${songId}/slots/${slotId}/claim`, { openToHandover: !!open });
    }
    await refreshSongs();
  },
  async leaveSlot(songId, part, uid){
    const slotId = slotIdOf(songId, part);
    await call("DELETE", `/songs/${songId}/slots/${slotId}/claim`);
    await refreshSongs();
  },

  /* ----- 활동 로그 ----- */
  async addLog(songId, entry){
    await call("POST", `/songs/${songId}/logs`, {
      type: entry.type,
      part: entry.part || null,
      detail: entry.detail || null,
      targetName: entry.targetName || null
    });
  },
  async listLogs(songId){
    return (await call("GET", `/songs/${songId}/logs`)).map(toUiLog);
  }
};

/* ---------- 인증 — 자체 계정 + 소셜 ----------
   자체 로그인은 서버의 /auth/login 이 우리 JWT 를 바로 돌려줍니다.
   구글은 구글이 발급한 ID 토큰을 /auth/google 에 넘기면,
   서버가 구글 공개키로 서명·iss·aud 를 검증하고 우리 JWT 를 돌려줍니다.
   어느 길로 들어오든 그 뒤의 모든 요청은 우리 JWT 하나로만 합니다. */

let gisReady = null;

function loadGis(){
  if (gisReady) return gisReady;
  gisReady = new Promise((resolve, reject) => {
    if (window.google && google.accounts && google.accounts.id) return resolve();
    const tag = document.getElementById("gis-script");
    if (!tag) return reject(new Error("구글 로그인 스크립트를 찾지 못했습니다"));
    tag.addEventListener("load", () => resolve(), { once:true });
    tag.addEventListener("error", () => reject(new Error("구글 로그인을 불러오지 못했습니다")), { once:true });
  });
  return gisReady;
}

        <h3>합주각</h3>
        <p>${signup ? "가입하고 합주에 참가하세요" : "로그인하고 합주에 참가하세요"}</p>
      </div>

      <div class="field">
        <label>아이디 (이메일 주소)</label>
        <input id="au-email" type="email" autocomplete="email"
               placeholder="hapjugak@example.com" maxlength="255">
      </div>

      <div class="field">
        <label>비밀번호</label>
        <div class="pw-wrap">
          <input id="au-pw" type="password" maxlength="72"
                 autocomplete="${signup ? "new-password" : "current-password"}"
                 placeholder="${signup ? "8자 이상" : "비밀번호"}">
          <button type="button" class="pw-eye" id="au-eye" title="비밀번호 보기">👁</button>
        </div>
      </div>
      ${signup ? `<p class="auth-rule" id="au-rule">영문·숫자 섞어 8자 이상</p>` : ""}

      ${signup ? `
      <div class="field">
        <label>닉네임</label>
        <input id="au-nick" maxlength="20" placeholder="합주에서 보일 이름">
      </div>` : ""}

      <button class="btn primary auth-submit" id="au-go">
        ${signup ? "가입하고 시작하기" : "로그인"}
      </button>

      <div class="err" id="au-err"></div>

      <div class="auth-or"><span>또는</span></div>
      <div class="auth-social" id="au-social"></div>

      <p class="auth-switch">
        ${signup ? "이미 계정이 있으신가요?" : "아직 회원이 아니신가요?"}
        <button id="au-switch">${signup ? "로그인" : "회원가입"}</button>
      </p>
      ${signup ? "" : `<p class="auth-help"><button id="au-help">로그인이 안 되나요?</button></p>`}
    </div>`, root => {

    const err  = root.querySelector("#au-err");
    const email= root.querySelector("#au-email");
    const pw   = root.querySelector("#au-pw");
    const nick = root.querySelector("#au-nick");
    const go   = root.querySelector("#au-go");

    const fail = m => { err.textContent = m; };

    root.querySelector("#au-eye").onclick = () => {
      pw.type = pw.type === "password" ? "text" : "password";
      pw.focus();
    };

    if (signup){
      const rule = root.querySelector("#au-rule");
      pw.addEventListener("input", () => {
        rule.classList.toggle("ok", pw.value.length >= 8);
      });
    }

    async function submit(){
      err.textContent = "";
      const e = email.value.trim();
      const p = pw.value;

      if (!e) return fail("아이디(이메일 주소)를 입력해주세요.");
      if (!p) return fail("비밀번호를 입력해주세요.");
      if (signup && p.length < 8) return fail("비밀번호는 8자 이상이어야 합니다.");
      const n = signup ? nick.value.trim() : "";
      if (signup && !n) return fail("닉네임을 입력해주세요.");

      go.disabled = true;
      go.textContent = signup ? "가입하는 중…" : "로그인하는 중…";
      try {
        if (signup){
          await call("POST", "/members", { email:e, password:p, nickname:n, area:"", bio:"" });
        }
        const issued = await call("POST", "/auth/login", { email:e, password:p });
        closeModal();
        await afterAuth(issued.accessToken);
        toast(signup ? "환영합니다!" : "로그인했습니다");
      } catch (ex) {
        // 서버가 보낸 메시지를 그대로 보여줍니다.
        // "구글로 가입한 계정입니다" 처럼 다음에 뭘 해야 하는지가 담겨 있습니다.
        fail(ex.message || "처리하지 못했습니다");
        go.disabled = false;
        go.textContent = signup ? "가입하고 시작하기" : "로그인";
      }
    }

    go.onclick = submit;
    [email, pw, nick].forEach(i => i && i.addEventListener("keydown", ev => {
      if (ev.key === "Enter") submit();
    }));

    root.querySelector("#au-switch").onclick = () => {
      closeModal();
      authModal(signup ? "login" : "signup");
    };

    root.querySelector("#au-help")?.addEventListener("click", () => {
      toast("곧 준비됩니다. 그때까지는 구글 로그인을 이용해주세요.");
    });

    renderSocialButtons(root.querySelector("#au-social"));
    email.focus();
  });
}

/* 소셜 로그인 제공자.

/* enabled 를 키 유무로 정합니다. 키를 안 넣은 채 버튼만 켜두면

     계정 연결 칸은 밝은 바탕이라 흰 심볼이 묻혀서 초록 심볼을 씁니다.
     iconBtn 이 없는 제공자는 두 곳에서 같은 파일을 씁니다. */
  { id:"naver",  label:"네이버 계정으로 로그인", cls:"social-naver",  icon:"img/btn-naver.png",

function startSocialLogin(id){

/* ── 카카오·네이버 — 팝업 + 돌아올 자리 ──────────────────────────────
   구글은 팝업이 코드를 부모 창에 직접 건네줍니다(ux_mode: popup).
   카카오·네이버에는 그 방법이 없고 "이 주소로 보내주겠다"는 리다이렉트뿐입니다.
   그래서 oauth.html 을 받을 자리로 두고, 거기서 postMessage 로 넘겨받습니다.

   state 는 여기서 만들어 들고 있다가 돌아온 값과 맞춰봅니다.
   이게 없으면 남이 만든 코드를 우리 창에 흘려넣어, 사용자가 자기도 모르게
   공격자의 계정으로 로그인하게 만들 수 있습니다(로그인 CSRF).
   값을 만든 쪽과 확인하는 쪽이 같은 창이라야 뜻이 있어서, 서버가 아니라
   여기서 합니다. */
function randomState(){
  const a = new Uint8Array(16);
  crypto.getRandomValues(a);
  return Array.from(a, b => b.toString(16).padStart(2, "0")).join("");
}

function kakaoAuthUrl(state){
  return "https://kauth.kakao.com/oauth/authorize"
    + "?response_type=code"
    + "&client_id=" + encodeURIComponent(KAKAO_CLIENT_ID)
    + "&redirect_uri=" + encodeURIComponent(OAUTH_REDIRECT)
    + "&state=" + encodeURIComponent(state)
    /* 매번 계정을 고르게 합니다. 없으면 한 번 로그인한 기기에서는
       버튼만 눌러도 바로 들어가서, 계정을 바꿀 길이 없습니다. */
    + "&prompt=login";
}

function naverAuthUrl(state){
  return "https://nid.naver.com/oauth2.0/authorize"
    + "?response_type=code"
    + "&client_id=" + encodeURIComponent(NAVER_CLIENT_ID)
    + "&redirect_uri=" + encodeURIComponent(OAUTH_REDIRECT)
    + "&state=" + encodeURIComponent(state);
}

/* mode 가 "login" 이면 토큰을 받아 로그인하고,
   "link" 면 이미 로그인한 계정에 연결만 붙입니다.
   받아오는 과정은 똑같아서 보내는 곳과 끝낸 뒤 할 일만 다릅니다. */
function startPopupLogin(provider, urlOf, mode, onDone){
  const state = randomState();
  const w = 480, h = 640;
  const left = Math.max(0, (screen.width  - w) / 2 + (screen.availLeft || 0));
  const top  = Math.max(0, (screen.height - h) / 2);
  const popup = window.open(urlOf(state), "hapjugak-oauth",
    `width=${w},height=${h},left=${left},top=${top}`);

  if (!popup){
    const 안내 = "팝업이 막혀 있습니다. 주소창 오른쪽에서 허용해 주세요";
    return mode === "link" ? toast(안내) : showAuthError(안내);
  }

  let done = false;

  const finish = () => {
    done = true;
    window.removeEventListener("message", onMessage);
    clearInterval(watch);
  };

  async function onMessage(ev){
    if (ev.origin !== location.origin) return;              // 우리 oauth.html 이 보낸 것만
    if (!ev.data || ev.data.source !== "hapjugak-oauth") return;
    if (done) return;
    finish();

    const { code, state: back, error } = ev.data;
    if (error) return showAuthError("로그인을 끝내지 못했습니다");
    /* 돌아온 state 가 다르면 우리가 띄운 창에서 온 것이 아닙니다. 버립니다. */
    if (back !== state) return showAuthError("로그인 정보가 맞지 않습니다. 다시 시도해 주세요");
    if (!code) return;

    try {
      if (mode === "link"){
        await call("POST", "/auth/link/" + provider, { code, state });
        toast("연결했습니다");
        if (onDone) await onDone();
      } else {
        const issued = await call("POST", "/auth/" + provider, { code, state });
        closeModal();
        await afterAuth(issued.accessToken);
        toast("로그인했습니다");
      }
    } catch (e) {
      if (mode === "link") toast(e.message || "연결하지 못했습니다");
      else showAuthError(e.message || "로그인에 실패했습니다");
    }
  }

  window.addEventListener("message", onMessage);

  /* 사용자가 팝업을 그냥 닫으면 아무 메시지도 오지 않습니다.
     그대로 두면 이벤트 핸들러가 영영 남으므로 창이 닫혔는지 지켜봅니다.
     닫은 것은 실패가 아니므로 조용히 정리만 합니다. */
  const watch = setInterval(() => {
    if (popup.closed && !done) finish();
  }, 500);
}

function showAuthError(message){
  const box = document.querySelector("#au-err");
  if (box) box.textContent = message;
  else toast(message);
}

/* 구글 — 인가 코드 방식.
   우리 버튼을 누르면 구글 팝업이 뜨고, 계정을 고르면 짧은 코드가 돌아옵니다.
   그 코드를 서버에 넘기면 서버가 client_secret 과 함께 구글에 되물어
   ID 토큰으로 바꾸고, 서명까지 검증한 뒤 우리 토큰을 돌려줍니다.

   예전에는 구글이 그려준 버튼으로 ID 토큰을 바로 받았습니다.
   동작은 같았지만 버튼 생김새를 우리가 정할 수 없었고,
   로그인된 계정이 버튼에 그대로 드러났습니다. */
let googleCodeClient = null;

/* 구글 코드를 받아 onCode 에 넘깁니다.
   로그인과 「계정 연결」이 받는 코드는 같고 보내는 곳만 다르므로,
   받는 부분만 여기 두고 쓰는 쪽을 함수로 받습니다. */
function requestGoogleCode(onCode, onError){
  loadGis().then(() => {
    const client = google.accounts.oauth2.initCodeClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: "openid email profile",
      ux_mode: "popup",
      select_account: true,       // 항상 계정 선택창을 띄웁니다
      callback: res => { if (res && res.code) onCode(res.code); },
      error_callback: err => {
        // 팝업을 그냥 닫은 경우는 실패가 아닙니다.
        if (err && err.type === "popup_closed") return;
        onError("구글 로그인을 끝내지 못했습니다");
      }
    });
    client.requestCode();
  }).catch(() => onError("구글 로그인을 불러오지 못했습니다"));
}

function startGoogleLogin(){
  requestGoogleCode(async code => {
    try {
      const issued = await call("POST", "/auth/google", { code });
      closeModal();
      await afterAuth(issued.accessToken);
      toast("로그인했습니다");
    } catch (e) {
      showAuthError(e.message || "구글 로그인에 실패했습니다");
    }
  }, showAuthError);
}

auth = {
  user: null,
  _cb: () => {},
  async onChange(cb){
    this._cb = cb;
    if (token){
      try {
        const m = await call("GET", "/members/me");
        this.user = toAuthUser(m);
        markAdmin(this.user.uid, m.role === "ADMIN");
      } catch (e) {
        setToken(null);

      }

  },

  }
};

   3. 유틸

const $ = s => document.querySelector(s);
const el = (t,c,txt) => { const n=document.createElement(t); if(c)n.className=c; if(txt!=null)n.textContent=txt; return n; };
const esc = s => String(s??"").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const DAYS = ["일","월","화","수","목","금","토"];
/* 날짜 비교는 반드시 보는 사람의 지역 시간 기준으로 합니다.
   toISOString()은 UTC라서 한국에서는 오전 9시 이전에 하루가 밀립니다. */
const pad2n = n => String(n).padStart(2,"0");
const localISO = (d = new Date()) =>
  `${d.getFullYear()}-${pad2n(d.getMonth()+1)}-${pad2n(d.getDate())}`;
const todayISO = () => localISO();

/* 날짜 칸의 상·하한.
   비워두면 브라우저가 27만 년까지 받습니다. 실제로 96874년 마감일이 들어왔습니다.
   서버에서도 같은 범위로 막지만, 눌러보기 전에 알려주는 편이 친절합니다. */
const DATE_MIN = "2000-01-01";
const dateMax = () => {
  const d = new Date();
  d.setFullYear(d.getFullYear() + 2);
  return localISO(d);
};

/* 참가비는 숫자와 안내 문구로 나뉘어 들어옵니다.
   둘 다 없으면 "미정", 숫자만 있으면 "15,000원",
   둘 다 있으면 "15,000원 · 대관비 N빵" 으로 보여줍니다. */
function feeText(e){
  const amount = (e.feeAmount === "" || e.feeAmount == null) ? null : Number(e.feeAmount);
  const money = amount == null ? "" : (amount === 0 ? "무료" : amount.toLocaleString("ko-KR") + "원");
  const note = (e.feeNote || "").trim();
  if (money && note) return money + " · " + note;
  return money || note || "미정";
}
function fmtDate(iso){
  /* 날짜 미정인 일정이 있습니다. 표시하는 곳마다 삼항 연산자를 쓰는 대신
     여기서 한 번에 처리합니다. 빠뜨린 곳에서 "Invalid Date"가 뜨지 않습니다. */
  if (!iso) return "날짜 미정";
  const d = new Date(iso+"T00:00:00");
  if (isNaN(d)) return iso;
  return `${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")} ${DAYS[d.getDay()]}`;
}
/* 사용자에게 보일 문장은 서버가 정합니다. 여기서는 그대로 옮기기만 합니다. */
function errText(err){
  const message = err && err.message ? String(err.message).trim() : "";
  return message ? message.slice(0, 120) : "처리하지 못했습니다";
}

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("on"), 2200);
}
const isUnset = s => !(s.requiredParts||[]).length;
// 파트가 하나도 없으면 성립이 아니라 '편성 미정'입니다.
// ([].every()는 true를 돌려주므로 반드시 먼저 걸러야 합니다.)
const isDone = s => !isUnset(s) && s.requiredParts.every(p => s.slots?.[p]);
function playerCount(songs){
  const set = new Set();
  songs.forEach(s => Object.values(s.slots||{}).forEach(v => v && set.add(v.uid)));
  return set.size;
}

function ensureCropCss(){
  if (document.getElementById("crop-css")) return;
  const tag = document.createElement("style");
  tag.id = "crop-css";
  tag.textContent = CROP_CSS;
  document.head.append(tag);
}

/* 이미지를 디코드한다.
   imageOrientation을 주지 않으면 폰으로 찍은 세로 사진이 90도 누운 채로 들어온다. */
async function decodeImage(file){
  try {
    return await createImageBitmap(file, { imageOrientation: "from-image" });
  } catch (e) {
    try { return await createImageBitmap(file); }
    catch (e2) { throw new Error("이 형식은 브라우저가 열지 못합니다. JPG나 PNG로 올려주세요."); }
  }
}

/**
 * 자르기 창을 띄우고, 사용자가 맞춘 영역을 Blob으로 돌려준다.
 * 취소하면 null.
 *
 * 자르기·줄이기·압축이 drawImage 한 번과 toBlob 한 번으로 끝난다.
 * 이 창이 하는 일은 사용자 조작을 받아 그릴 위치와 배율을 정하는 것뿐이다.
 */
async function cropImage(file, opt){
  const aspect = opt.aspect || 1;
  const outW   = opt.out || 512;
  const outH   = Math.round(outW / aspect);
  const round  = !!opt.round;
  const quality = opt.quality || 0.82;

  if (!file.type.startsWith("image/")) throw new Error("이미지 파일만 올릴 수 있습니다");
  if (file.size > 20 * 1024 * 1024)    throw new Error("20MB 이하 이미지만 올릴 수 있습니다");

  const bitmap = await decodeImage(file);
  ensureCropCss();

  const viewW = Math.min(320, window.innerWidth - 80);
  const viewH = Math.round(viewW / aspect);

  const wrap = document.createElement("div");
  wrap.className = "crop-wrap";
  wrap.innerHTML = `
    <div class="crop-card">
      <h3>${opt.title || "이미지 자르기"}</h3>
      <p class="crop-hint">드래그해서 위치를 옮기고, 아래 막대나 마우스 휠로 크기를 맞추세요.</p>
      <div class="crop-stage" style="width:${viewW}px;height:${viewH}px">
        <canvas></canvas>
        <div class="crop-mask${round ? " round" : ""}"></div>
      </div>
      <div class="crop-zoom"><span>−</span><input type="range" min="100" max="400" value="100"><span>+</span></div>
      <div class="crop-err"></div>
      <div class="crop-actions">
        <button class="btn ghost" data-act="cancel" type="button">취소</button>
        <button class="btn primary" data-act="ok" type="button">적용</button>
      </div>
    </div>`;
  document.body.append(wrap);

  const stage  = wrap.querySelector(".crop-stage");
  const canvas = wrap.querySelector("canvas");
  const zoom   = wrap.querySelector('input[type="range"]');
  const errBox = wrap.querySelector(".crop-err");
  const okBtn  = wrap.querySelector('[data-act="ok"]');

  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width  = Math.round(viewW * dpr);
  canvas.height = Math.round(viewH * dpr);
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingQuality = "high";

  const bw = bitmap.width, bh = bitmap.height;
  const minScale = Math.max(viewW / bw, viewH / bh);   // 틀을 꽉 채우는 최소 배율
  let scale = minScale;
  let tx = (viewW - bw * scale) / 2;
  let ty = (viewH - bh * scale) / 2;

  function clamp(){
    const w = bw * scale, h = bh * scale;
    tx = Math.min(0, Math.max(viewW - w, tx));
    ty = Math.min(0, Math.max(viewH - h, ty));
  }
  function paint(){
    clamp();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, viewW, viewH);
    ctx.drawImage(bitmap, tx, ty, bw * scale, bh * scale);
  }
  /* 화면의 한 점을 기준으로 확대한다. 그래야 보고 있던 부분이 그대로 남는다. */
  function zoomTo(next, cx, cy){
    next = Math.max(minScale, Math.min(minScale * 4, next));
    const k = next / scale;
    tx = cx - (cx - tx) * k;
    ty = cy - (cy - ty) * k;
    scale = next;
    zoom.value = String(Math.round(scale / minScale * 100));
    paint();
  }
  paint();

  let dragging = false, lastX = 0, lastY = 0, pinch = 0;

  function pointFrom(e){
    const r = stage.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }
  function down(e){
    if (e.touches && e.touches.length === 2){ pinch = dist(e); return; }
    dragging = true; stage.classList.add("dragging");
    const p = pointFrom(e); lastX = p.x; lastY = p.y;
  }
  function move(e){
    if (e.touches && e.touches.length === 2){
      e.preventDefault();
      const d = dist(e);
      if (pinch){
        const r = stage.getBoundingClientRect();
        const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left;
        const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top;
        zoomTo(scale * (d / pinch), cx, cy);
      }
      pinch = d;
      return;
    }
    if (!dragging) return;
    e.preventDefault();
    const p = pointFrom(e);
    tx += p.x - lastX; ty += p.y - lastY;
    lastX = p.x; lastY = p.y;
    paint();
  }
  function up(){ dragging = false; pinch = 0; stage.classList.remove("dragging"); }
  function dist(e){
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    return Math.hypot(dx, dy);
  }

  stage.addEventListener("mousedown", down);
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);
  stage.addEventListener("touchstart", down, { passive: true });
  stage.addEventListener("touchmove", move, { passive: false });
  stage.addEventListener("touchend", up);
  stage.addEventListener("wheel", e => {
    e.preventDefault();
    const p = pointFrom(e);
    zoomTo(scale * (e.deltaY < 0 ? 1.12 : 1 / 1.12), p.x, p.y);
  }, { passive: false });
  zoom.oninput = () => zoomTo(minScale * (Number(zoom.value) / 100), viewW / 2, viewH / 2);

  return new Promise(resolve => {
    function close(value){
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
      wrap.remove();
      bitmap.close && bitmap.close();
      resolve(value);
    }
    wrap.querySelector('[data-act="cancel"]').onclick = () => close(null);
    wrap.onclick = e => { if (e.target === wrap) close(null); };
    okBtn.onclick = () => {
      okBtn.disabled = true;
      const k = outW / viewW;                       // 화면 좌표 → 결과 좌표
      const out = document.createElement("canvas");
      out.width = outW; out.height = outH;
      const g = out.getContext("2d");
      g.imageSmoothingQuality = "high";
      g.drawImage(bitmap, tx * k, ty * k, bw * scale * k, bh * scale * k);
      out.toBlob(blob => {
        if (blob) return close(blob);
        out.toBlob(b2 => {                          // WebP를 못 만드는 브라우저
          if (!b2){ errBox.textContent = "이미지를 만들지 못했습니다"; okBtn.disabled = false; return; }
          close(b2);
        }, "image/jpeg", quality);
      }, "image/webp", quality);
    };
  });
}

/**
 * 서명을 받아 S3로 바로 올린다. 저장되는 건 주소 문자열 하나다.
 * 서버는 서명만 내주고, 그 주소를 저장할 때 크기와 형식을 한 번 더 확인한다.
 */
async function uploadImage(blob, kind){
  const sign = await call("POST", "/uploads/presign", {
    kind, contentType: blob.type, size: blob.size
  });
  const res = await fetch(sign.uploadUrl, {
    method: "PUT",
    headers: { "Content-Type": blob.type },
    body: blob
  });
  if (!res.ok) throw new Error("이미지를 올리지 못했습니다 (" + res.status + ")");
  return sign.publicUrl;
}

/** 프로필 사진: 1:1로 잘라 512px WebP로 올린다. 취소하면 null. */
async function pickProfilePhoto(file){
  const blob = await cropImage(file, { aspect: 1, out: 512, round: true, title: "프로필 사진 자르기" });
  if (!blob) return null;
  return await uploadImage(blob, "PROFILE");
}

/* ============================================================
   6. 목록 화면
   ============================================================ */
let allEvents = [];
let allSongs = [];
/* 이 일정의 곡만 골라냅니다. */
const songsOf = eid => allSongs.filter(sg => sg.eventId === eid);
const pad2 = n => String(n).padStart(2,"0");
const iso = (y,m,d) => `${y}-${pad2(m+1)}-${pad2(d)}`;

function canSeeInList(e){
  if (e.visibility !== "private") return true;
  if (!auth.user) return false;
  if (e.hostUid === auth.user.uid) return true;
  return songsOf(e.id).some(s =>
    Object.values(s.slots||{}).some(v => v && v.uid === auth.user.uid));
}

/* ── 메인 목록 ─────────────────────────────────────────────
   월별로 묶어 한 줄씩 보여줍니다.
   카드 격자에서 한 줄 시트로 바꾼 이유: 일정이 늘어날수록 카드는
   훑기가 어려워집니다. 날짜·이름·빈 파트가 세로로 줄을 맞춰야
   "어디에 내 자리가 있나"를 눈으로 쓸어내리며 찾을 수 있습니다. */

/* 자리 이름(「기타2」)에 맞는 프로필의 악기 이름(「일렉기타」)을 찾습니다. */
/* openParts() 가 여기 있었습니다. 목록 줄마다 「비어 있는 파트」 칩을 깔고
   내가 하는 파트를 앞으로 당겨 주던 함수입니다. 그 칩을 걷어냈으므로 함수도 지웁니다.
   (줄 오른쪽의 「N자리 남음」 은 그대로 둡니다 — 세는 쪽은 renderCards 안에 있습니다) */

const SEGS = [
  { key:"open",  label:"모집 중" },
  { key:"host",  label:"내 합주" },
  { key:"past",  label:"지난 합주" }
];
let segKey = "open", listQuery = "";

function isPastEvent(e){
  /* 날짜 미정은 지난 합주가 아닙니다. 아직 잡는 중이니 모집 중에 둡니다. */
  return eventDone(e) || (!!e.date && e.date < todayISO());
}

function iHaveSeat(e){
  if (!auth.user) return false;
  return songsOf(e.id).some(sg =>
    Object.values(sg.slots || {}).some(v => v && v.uid === auth.user.uid));
}

function segFilter(key, e){
  if (key === "past") return isPastEvent(e);
  if (key === "host") return !!auth.user && e.hostUid === auth.user.uid;
  if (key === "mine") return !isPastEvent(e) && iHaveSeat(e);
  return !isPastEvent(e);
}

function matchesQuery(e, q){
  if (!q) return true;
  const hay = [e.title, e.region, e.studio, e.room, e.genre].filter(Boolean).join(" ").toLowerCase();
  return hay.includes(q);
}

function renderCards(){
  renderSeg();
  renderCalendar();
  renderBandNext();
  renderFeed();

  const box = $("#event-sheets");
  box.innerHTML = "";

  const q = listQuery.trim().toLowerCase();
  const list = allEvents.filter(canSeeInList).filter(e => segFilter(segKey, e)).filter(e => matchesQuery(e, q));

  /* 모집 중은 가까운 날짜가 위로, 지난 합주는 최근이 위로.
     날짜 미정은 어느 쪽이든 맨 위입니다 — 아직 잡는 중이라 눈이 가야 하는 쪽입니다. */
  const past = segKey === "past";
  list.sort((a, b) => {
    /* 어느 칸에서든 이미 지난 합주는 아래로 내립니다.
       「내 합주」에 9월이 11월보다 위에 오던 이유입니다. */
    const ap = isPastEvent(a), bp = isPastEvent(b);
    if (!past && ap !== bp) return ap ? 1 : -1;
    if (!a.date && !b.date) return 0;
    if (!a.date) return -1;
    if (!b.date) return 1;
    // 지난 것끼리는 최근이 위, 앞으로의 것끼리는 가까운 날이 위
    return (past || ap) ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date);
  });

  if (!list.length){
    box.append(el("div","empty-note", q
      ? `«${listQuery.trim()}»(으)로 찾은 합주가 없습니다.`
      : segKey === "past" ? "지난 합주 기록이 아직 없습니다."
      : segKey === "host" ? "아직 연 합주가 없습니다. 오른쪽 위에서 만들어보세요."
      : segKey === "mine" ? "자리를 잡아둔 합주가 없습니다."
      : "열린 합주가 아직 없습니다. 직접 열어보세요."));
    return;
  }

  /* 월별로 끊어 담습니다. 날짜 미정은 따로 한 덩이. */
  const groups = [];
  let cur = null;
  list.forEach(e => {
    const key = e.date ? e.date.slice(0, 7) : "미정";
    if (!cur || cur.key !== key) { cur = { key, items: [] }; groups.push(cur); }
    cur.items.push(e);
  });

  renderPast();

  groups.forEach(g => {
    const head = el("div","month");
    head.append(el("b","", g.key === "미정" ? "날짜 미정" : `${Number(g.key.slice(5,7))}월`));
    box.append(head);

    const sheet = el("div","sheet");
    g.items.forEach(e => sheet.append(eventRow(e)));
    box.append(sheet);
  });
}

function eventRow(e){
  const songs = songsOf(e.id);
  const done = songs.filter(isDone).length;
  const a = el("a","row");
  a.href = "#/e/" + e.id + (e.visibility === "private" && e.inviteKey ? "/" + e.inviteKey : "");

  /* 날짜 칸 — 토요일은 파랑, 일요일은 빨강. 합주는 주말에 몰립니다. */
  const d = el("div","date");
  if (e.date){
    const dt = new Date(e.date + "T00:00:00");
    const dow = dt.getDay();
    if (dow === 6) d.classList.add("sat");
    if (dow === 0) d.classList.add("sun");
    d.append(el("b","", String(dt.getDate())));
    d.append(el("span","", DAYS[dow]));
  } else {
    d.append(el("b","", "–"));
    d.append(el("span","", "미정"));
  }
  a.append(d);

  const info = el("div","info");
  info.append(el("h3","", e.title));
  const where = [e.region || "지역 미정",
                 [e.studio, e.room].filter(Boolean).join(" ") || "합주실 미정",
                 eventTime(e) || null,
                 songs.length ? `곡 ${songs.length}` : "곡 없음"].filter(Boolean).join(" · ");
  info.append(el("p","", where));
  a.append(info);

  /* 비어 있는 파트 칩은 보여주지 않습니다. 자리 수만 오른쪽에 둡니다. */

  /* 목업과 같이 「채운 자리 / 전체 자리」 와 남은 자리 수를 보여줍니다. */
  let seats = 0, taken = 0;
  songs.forEach(sg => {
    const parts = sg.requiredParts || [];
    seats += parts.length;
    taken += parts.filter(pt => (sg.slots || {})[pt]).length;
  });
  const left = seats - taken;
  const count = el("div","count" + (seats && !left ? " done" : ""));
  count.append(document.createTextNode(seats ? `${taken}/${seats}` : "—"));
  if (!seats) count.append(el("small","", "아직 없음"));
  else if (left) count.append(el("small","", `${left}자리 남음`));
  a.append(count);

  const chev = document.createElementNS("http://www.w3.org/2000/svg","svg");
  chev.setAttribute("class","chev");
  chev.setAttribute("viewBox","0 0 24 24");
  chev.setAttribute("fill","none");
  chev.setAttribute("stroke","currentColor");
  chev.setAttribute("stroke-width","2");
  chev.innerHTML = '<path d="m9 6 6 6-6 6" stroke-linecap="round"/>';
  a.append(chev);
  return a;
}

/* 목록 아래의 「지난 합주」 — 끝난 합주를 카드로 몇 개만.
   본문이 이미 지난 합주일 때는 같은 것을 두 번 보여줄 이유가 없어 숨깁니다. */
function renderPast(){
  const wrap = $("#past-wrap");
  const box = $("#past-list");
  const list = allEvents.filter(canSeeInList).filter(eventDone)
    .sort((a,b) => (b.date||"").localeCompare(a.date||""))
    .slice(0, 6);

  if (segKey === "past" || !list.length){ wrap.classList.add("hide"); return; }
  wrap.classList.remove("hide");
  $("#past-n").textContent = allEvents.filter(canSeeInList).filter(eventDone).length;
  box.innerHTML = "";
  list.forEach(e => {
    const songs = songsOf(e.id);
    const a = document.createElement("a");
    a.href = "#/e/" + e.id + (e.visibility === "private" && e.inviteKey ? "/" + e.inviteKey : "");
    a.append(el("h4","", e.title));
    const d = e.date ? `${Number(e.date.slice(5,7))}월 ${Number(e.date.slice(8,10))}일` : "날짜 미정";
    const pEl = el("p","");
    pEl.innerHTML = `${esc(d)} · ${esc(e.region || "지역 미정")}<br>곡 ${songs.length} · 참가 ${playerCount(songs)}명`;
    a.append(pEl);
    box.append(a);
  });
}

function renderSeg(){
  const box = $("#list-seg");
  box.innerHTML = "";
  SEGS.forEach(sg => {
    // 로그인하지 않았으면 "내 ..." 칸은 셀 것이 없습니다.
    if ((sg.key === "mine" || sg.key === "host") && !auth.user) return;
    const n = allEvents.filter(canSeeInList).filter(e => segFilter(sg.key, e)).length;
    const b = el("button","");
    b.type = "button";
    b.setAttribute("aria-pressed", String(sg.key === segKey));
    b.append(document.createTextNode(sg.label));
    b.append(el("b","", String(n)));
    b.onclick = () => { segKey = sg.key; renderCards(); };
    box.append(b);
  });
}

/* 밴드 오른쪽의 「내 다음 합주」. 자리를 잡아둔 합주 중 가장 가까운 것. */
/* 밴드의 한 줄 설명. 프로필에 파트를 적어둔 사람에게는 그 파트를 짚어줍니다 —
   목록에서 주황으로 뜨는 것이 무엇인지 한 번에 알 수 있습니다. */
function renderBandNext(){
  const box = $("#band-next");
  if (!auth.user){ box.classList.add("hide"); return; }
  const today = todayISO();
  const next = allEvents
    .filter(e => !eventDone(e) && e.date && e.date >= today && iHaveSeat(e))
    .sort((a,b) => a.date.localeCompare(b.date))[0];
  if (!next){ box.classList.add("hide"); return; }

  const days = Math.round((new Date(next.date+"T00:00:00") - new Date(today+"T00:00:00")) / 86400000);
  const dt = new Date(next.date+"T00:00:00");
  const songs = songsOf(next.id);
  const myParts = [...new Set(songs.flatMap(sg =>
    Object.entries(sg.slots || {}).filter(([,v]) => v && v.uid === auth.user.uid).map(([pt]) => pt)))];

  box.classList.remove("hide");
  box.innerHTML = "";
  box.append(el("div","lb","내 다음 합주"));
  const dd = el("div","dd");
  dd.append(el("b","", days === 0 ? "오늘" : `D-${days}`));
  dd.append(el("span","", `${dt.getMonth()+1}월 ${dt.getDate()}일 ${DAYS[dt.getDay()]}`));
  box.append(dd);
  box.append(el("h4","", next.title));
  const row = el("div","row2");
  myParts.slice(0,2).forEach(pt => row.append(el("span","mini on", pt)));
  row.append(el("span","mini", `곡 ${songs.length}`));
  box.append(row);
  box.onclick = () => { location.hash = "#/e/" + next.id; };
  box.style.cursor = "pointer";
}

/* 사이드바의 「방금 있었던 일」.
   서버에 전체 활동 주소가 따로 없어서, 이미 받아둔 곡 목록에서 만듭니다.
   요청을 하나도 더 쓰지 않습니다. */
function renderFeed(){
  const box = $("#home-feed");
  box.innerHTML = "";
  const recent = allSongs.slice().sort((a,b) => (b.createdAt||0) - (a.createdAt||0)).slice(0, 6);
  if (!recent.length){
    box.append(el("div","fi", "아직 올라온 곡이 없습니다."));
    return;
  }
  recent.forEach(sg => {
    const fi = el("div","fi" + (isDone(sg) ? " hot" : ""));
    fi.append(el("i",""));
    const pEl = document.createElement("p");
    if (isDone(sg)){
      pEl.innerHTML = `<b>${esc(sg.title)}</b> 각이 나왔습니다`;
    } else {
      pEl.innerHTML = `<b>${esc(sg.proposerName || "누군가")}</b>님이 <b>${esc(sg.title)}</b>를 올렸습니다`;
    }
    fi.append(pEl);
    fi.append(el("time","", agoText(sg.createdAt)));
    box.append(fi);
  });
}

function agoText(ms){
  if (!ms) return "";
  const m = Math.floor((Date.now() - ms) / 60000);
  if (m < 1) return "방금";
  if (m < 60) return m + "분";
  const h = Math.floor(m / 60);
  if (h < 24) return h + "시간";
  return Math.floor(h / 24) + "일";
}

function eventTime(e){
  if (e.timeStart && e.timeEnd) return `${e.timeStart}–${e.timeEnd}`;
  if (e.timeStart) return `${e.timeStart} 시작`;
  return e.time || "";
}

/* ── 일정 머리 ───────────────────────────────────────────
   커버 사진 · D-day · 제목 · 참가비/마감/주최 · 자리 채움 막대.
   사진이 없으면 어두운 그라데이션 판이 대신 들어갑니다. */
function renderEventHead(e){
  const t = eventTime(e);
  const thumb = $("#ev-thumb");
  thumb.classList.toggle("empty", !e.cover);
  thumb.style.backgroundImage = e.cover ? `url("${e.cover}")` : "";

  /* D-day 는 날짜가 있을 때만. 미정이면 그 자리에 「날짜 미정」을 둡니다. */
  const dday = $("#ev-dday");
  if (e.date && !eventDone(e)){
    const days = Math.round((new Date(e.date+"T00:00:00") - new Date(todayISO()+"T00:00:00")) / 86400000);
    dday.textContent = days === 0 ? "오늘" : days > 0 ? `D-${days}` : "지난 합주";
  } else {
    dday.textContent = eventDone(e) ? "합주 완료" : "날짜 미정";
  }
  $("#ev-when").textContent = [e.date ? fmtDate(e.date) : null, t, e.genre].filter(Boolean).join(" · ");
  $("#ev-title").textContent = e.title;
  $("#ev-title").classList.toggle("is-done", eventDone(e));
  $("#ev-where").textContent =
    [e.region || "지역 미정", [e.studio, e.room].filter(Boolean).join(" ") || "합주실 미정"].join(" · ");

  const desc = $("#ev-desc");
  desc.textContent = e.description || "";
  desc.classList.toggle("hide", !e.description);
  setupClamp(desc, desc.parentNode);

  /* 주최자·관리자 버튼. 링크 복사는 누구나 쓸 수 있습니다. */
  const acts = $("#ev-acts");
  acts.innerHTML = "";
  const share = el("button","btn ghost","링크 복사");
  share.onclick = () => copyShareLink(e);
  acts.append(share);

  if (auth.user && (e.hostUid === auth.user.uid || isAdmin())){
    const edit = el("button","btn ghost","일정 수정");
    edit.onclick = () => eventModal(curEvent);
    acts.append(edit);

    const done = eventDone(e);
    const c = el("button","btn ghost", done ? "완료 해제" : "합주 완료로 표시");
    c.onclick = () => completeEvent(e, !done);
    acts.append(c);

    const d = el("button","btn ghost","삭제");
    d.style.color = "var(--danger)";
    d.onclick = () => deleteEventFlow(e);
    acts.append(d);
  }

  /* 참가비 · 마감 · 주최 · 자리 */
  const songs = songsOf(e.id);
  const people = playerCount(songs);
  const cap = e.roomCapacity || 0;
  const kv = $("#ev-kv");
  kv.innerHTML = "";
  const item = (label, value) => {
    const d = el("div","");
    d.append(document.createTextNode(label));
    d.append(el("b","", value));
    return d;
  };
  kv.append(item("참가비", feeText(e)));
  if (e.entryDeadline) kv.append(item("곡 신청 마감", fmtDate(e.entryDeadline)));
  if (e.maxSongsPerUser) kv.append(item("1인당", `${e.maxSongsPerUser}곡까지`));
  kv.append(item("주최", e.hostName || "—"));

  const fill = el("div","fill");
  fill.append(document.createTextNode("자리 "));
  const b = el("b","", cap ? `${people} / ${cap}` : `${people}명`);
  b.style.display = "inline";
  fill.append(b);
  const bar = el("div","h3bar");
  const i = el("i","");
  i.style.width = cap ? Math.min(100, Math.round(people / cap * 100)) + "%" : "0%";
  bar.append(i);
  fill.append(bar);
  kv.append(fill);

  const doneBox = $("#ev-done");
  doneBox.classList.toggle("hide", !eventDone(e));
  if (eventDone(e)){
    doneBox.textContent = `합주 완료 · ${songs.length}곡을 연주했습니다`
      + (autoDone(e) ? " · 날짜가 지나 자동으로 완료됐습니다"
         : e.completedAt ? ` · ${new Date(e.completedAt).toLocaleDateString("ko-KR")} 기록` : "");
  }
  document.title = `${e.title} — 합주각`;
}

/* 합주가 끝났다고 표시된 일정입니다. 곡은 여기 속한 채로 기록으로 남습니다. */
/* 합주 완료 판정
   - 주최자·관리자가 완료로 표시했으면 완료 (completed: true)
   - 완료를 해제했으면 날짜와 상관없이 진행 중 (completed: false)
   - 아무도 건드리지 않았으면 합주 날짜가 지나는 순간 자동으로 완료 */
const eventDone = e => {
  if (!e) return false;
  if (e.completed === true) return true;
  if (e.completed === false) return false;
  return !!e.date && e.date < todayISO();
};
const autoDone = e => !!e && e.completed === undefined && eventDone(e);

/* 곡 신청 마감 판정. 주최자와 관리자는 마감 뒤에도 손볼 수 있습니다. */
function entryClosed(){
  if (eventDone(curEvent)) return true;        // 끝난 합주는 잠깁니다
  if (!curEvent?.entryDeadline) return false;
  return todayISO() > curEvent.entryDeadline;
}


/* ── 상세 화면을 갈아끼울 때 함께 지워졌던 조각들입니다. 되살립니다. ── */
const closedForMe = () => entryClosed() && !(isAdmin() || isEventHost());

function closedMsg(what){
  if (eventDone(curEvent)) return `합주가 끝난 일정이라 ${what}`;
  return `${fmtDate(curEvent?.entryDeadline)}에 마감돼 ${what}`;
}

function passDeadline(what){
  if (!entryClosed()) return true;
  if (closedForMe()) return false;
  const why = eventDone(curEvent)
    ? "이미 합주 완료로 표시된 일정입니다."
    : `${fmtDate(curEvent.entryDeadline)}에 곡 신청이 마감된 합주입니다.`;
  return confirm(`${why}\n\n주최자·관리자 권한으로 ${what} 진행할까요?`);
}

function whenText(ts){
  const diff = Date.now() - ts;
  const min = Math.floor(diff / 60000);
  if (min < 1) return "방금";
  if (min < 60) return `${min}분 전`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr}시간 전`;
  const day = Math.floor(hr / 24);
  if (day < 7) return `${day}일 전`;
  return new Date(ts).toLocaleDateString("ko-KR");
}

async function claimSlot(song, part, taken, mine){
  if (!requireLogin()) return;
  if (mine){ mySlotModal(song, part); return; }
  if (taken && !taken.open){ toast(`${taken.name} 님이 이미 맡았습니다`); return; }

  {
    if (closedForMe()){
      toast(closedMsg("자리를 바꿀 수 없습니다")); return;
    }
    if (!passDeadline("자리 배정을")) return;
    // 1인당 곡수 제한은 일정마다 따로 셉니다.
    const limit = curEvent?.maxSongsPerUser || 0;
    if (limit){
      const inThis = Object.values(song.slots||{}).some(v => v && v.uid === auth.user.uid);
      const mySongs = curSongs.filter(x =>
        Object.values(x.slots||{}).some(v => v && v.uid === auth.user.uid)).length;
      if (!inThis && mySongs >= limit){
        toast(`이 합주는 1인당 ${limit}곡까지입니다`); return;
      }
    }
  }
  enterModal(song, part, taken);
}

function songTools(song){
  const tools = el("div","song-tools");
  if (song.youtube && /^https?:\/\//i.test(song.youtube)){
    const a = document.createElement("a");
    a.className = "song-yt"; a.href = song.youtube;
    a.target = "_blank"; a.rel = "noopener noreferrer";
    a.title = "유튜브에서 원곡 열기";
    a.innerHTML = '<svg viewBox="0 0 12 14" aria-hidden="true" focusable="false">'
      + '<path d="M1.5 1.3 11 7l-9.5 5.7V1.3Z" fill="currentColor"/></svg>';
    a.append(document.createTextNode("YouTube"));
    tools.append(a);
  }
  const log = el("button","song-edit","로그");
  log.title = "이 곡의 변경 기록 보기";
  log.onclick = () => logModal(song);
  tools.append(log);

  if (canEditSong(song)){
    const edit = el("button","song-edit","편집");
    edit.title = "곡 정보와 필요 파트 편집";
    edit.onclick = () => songModal(song);
    tools.append(edit);
  }
  return tools;
}

/* 파트 칸. 모집하지 않는 파트는 아예 그리지 않습니다 —
   예전에는 빗금으로 남겨뒀는데, 칸이 길어지기만 하고 읽을 것은 없었습니다. */
function songSlots(song){
  const box = el("div","slots");
  const req = song.requiredParts || [];

  req.forEach(p => {
    const taken = song.slots?.[p];
    const mine = taken && auth.user && taken.uid === auth.user.uid;
    const held = (!taken && auth.user) ? heldInstrument(song.slots, p, auth.user.uid) : null;
    const yieldable = taken && taken.open;

    const cls = mine ? "chip on mine" : taken ? "chip on" : held ? "chip locked" : "chip open";
    const c = el("span", cls);
    if (taken) c.append(el("span","dot"));
    c.append(document.createTextNode(p));
    if (taken){
      const em = el("em","", taken.name);
      if (yieldable) em.append(el("span","yield-mark","⇄"));
      c.append(document.createTextNode(" "));
      c.append(em);
    } else {
      c.append(document.createTextNode(held ? " 들어갈 수 없음" : " 비어 있음"));
    }

    const managing = manageMode && canManageSlots();
    if (managing) c.classList.add("managing");
    c.setAttribute("role","button");
    c.tabIndex = 0;
    c.title = managing
      ? `${p} 자리에 사람을 넣거나 빼기`
      : mine ? `내 자리 · ${taken.open ? "양도 가능" : "양도 불가능"} · 눌러서 바꾸기`
      : taken ? (taken.open
          ? `${taken.name} 님이 양도 가능으로 잡아둔 자리입니다. 눌러서 넘겨받기`
          : `${taken.name} 님이 맡았습니다`)
      : held ? `${held}을 맡고 있어 다른 악기는 들어갈 수 없습니다` : `${p} 자리에 들어가기`;

    const act = () => {
      if (managing){ slotAdminModal(song, p); return; }
      if (held){ toast(`${held}을 먼저 취소해야 옮길 수 있습니다`); return; }
      claimSlot(song, p, taken, mine);
    };
    c.onclick = act;
    c.onkeydown = ev => { if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); act(); } };
    box.append(c);
  });
  return box;
}

function songBadge(song, done){
  if (song.eventId && eventDone(allEvents.find(e => e.id === song.eventId)))
    return el("span","tag","합주 완료");
  if (isUnset(song)) return el("span","tag","편성 미정");
  const req = song.requiredParts || [];
  const left = req.filter(p => !song.slots?.[p]).length;
  return done ? el("span","tag ok","각 나왔습니다") : el("span","tag", `${left}자리 남음`);
}

/* ── 자리(파트) 고르기 ────────────────────────────────────────────
   같은 파트를 여러 명 모집하는 일과, 목록에 없는 악기를 적는 일을
   한 가지 방법으로 처리합니다 — 누르면 늘어나고, 늘어나면 번호가 붙습니다.

     [보컬] 한 번  → 보컬
     [보컬] 두 번  → 보컬1, 보컬2        (먼저 있던 것에도 번호가 붙습니다)
     하나를 빼면   → 다시 보컬           (번호는 둘 이상일 때만 뜻이 있습니다)

   직접 적은 이름도 똑같이 굴러갑니다. 색소폰을 두 번 누르면 색소폰1·색소폰2 입니다. */
/* 새 곡을 올릴 때 미리 채워둘 자리. 그 합주의 기본 편성을 씁니다.
   정해둔 것이 없으면 밴드 한 팀 분량으로 시작합니다. */
function defaultPartsOf(e){
  const d = (e && e.defaultParts) || [];
  return d.length ? d.slice() : ["보컬","기타","베이스","드럼"];
}

const PART_MAX = 12;
const baseName = label => String(label).replace(/\s*\d+$/, "").trim();

function partPicker(initial){
  let list = (initial || []).map(x => String(x).trim()).filter(Boolean);

  const wrap   = el("div","partpick2");
  const presets= el("div","pp-presets");
  const chosen = el("div","pp-chosen");
  const addRow = el("div","pp-add");
  const input  = document.createElement("input");
  input.type = "text"; input.maxLength = 20; input.placeholder = "직접 적기 — 색소폰, 코러스 …";
  const addBtn = el("button","pp-addbtn","추가"); addBtn.type = "button";
  const note   = el("p","ava-note","같은 파트를 두 번 누르면 번호가 붙습니다. 보컬·기타가 둘 이상일 때 이렇게 씁니다.");

  /* 번호는 여기 한 곳에서만 매깁니다.
     하나뿐이면 번호를 떼고(「보컬」), 둘 이상이면 보이는 차례대로 1부터 다시 답니다.
     그래야 가운데 하나를 빼도 「보컬2, 보컬3」 같은 것이 남지 않습니다. */
  const tidy = () => {
    const total = {};
    list.forEach(x => { const b = baseName(x); total[b] = (total[b] || 0) + 1; });
    const seen = {};
    list = list.map(x => {
      const b = baseName(x);
      if (total[b] === 1) return b;
      seen[b] = (seen[b] || 0) + 1;
      return b + seen[b];
    });
    /* 고른 차례가 아니라 보여줄 차례로 세웁니다 — 곡 카드에 보이는 것과 같아야 합니다. */
    list.sort(byPartOrder);
  };

  const add = raw => {
    const name = baseName(raw);
    if (!name) return "이름을 적어주세요.";
    if (name.length > 20) return "파트 이름은 20자까지 쓸 수 있습니다.";
    if (/[<>]/.test(name)) return "파트 이름에 쓸 수 없는 글자가 있습니다.";
    if (list.length >= PART_MAX) return `자리는 ${PART_MAX}개까지 만들 수 있습니다.`;

    /* 같은 종류가 이미 있으면 그 옆에 붙입니다. 맨 뒤에 붙이면
       보컬1 … 드럼 … 보컬2 처럼 흩어져서 읽기 어렵습니다. */
    let at = -1;
    list.forEach((x, i) => { if (baseName(x) === name) at = i; });
    if (at < 0) list.push(name); else list.splice(at + 1, 0, name);
    tidy();
    paint();
    return null;
  };

  const paint = () => {
    chosen.innerHTML = "";
    if (!list.length){
      chosen.append(el("span","pp-none","아직 고른 자리가 없습니다."));
    } else {
      list.forEach((label, i) => {
        const c = el("span","pp-chip");
        c.append(document.createTextNode(label));
        const x = el("button","pp-x","×");
        x.type = "button"; x.title = `${label} 빼기`;
        x.onclick = () => { list.splice(i,1); tidy(); paint(); };
        c.append(x);
        chosen.append(c);
      });
    }
    presets.querySelectorAll("button").forEach(b => {
      const n = list.filter(x => baseName(x) === b.dataset.name).length;
      b.classList.toggle("on", n > 0);
      b.querySelector(".pp-n").textContent = n > 1 ? String(n) : "";
    });
  };

  PART_PRESETS.forEach(name => {
    const b = el("button","");
    b.type = "button"; b.dataset.name = name;
    b.append(document.createTextNode(name));
    b.append(el("span","pp-n",""));
    b.title = `${name} 자리 추가 (다시 누르면 하나 더)`;
    b.onclick = () => { const msg = add(name); if (msg) toast(msg); };
    presets.append(b);
  });

  const submit = () => {
    const msg = add(input.value);
    if (msg){ toast(msg); return; }
    input.value = "";
    input.focus();
  };
  addBtn.onclick = submit;
  input.addEventListener("keydown", e => {
    if (e.key === "Enter"){ e.preventDefault(); submit(); }
  });

  addRow.append(input, addBtn);
  wrap.append(presets, addRow, chosen, note);
  tidy();      // 미리 채워둔 것도 번호 규칙을 따르게 합니다
  paint();

  return {
    el: wrap,
    get: () => list.slice(),
    setDisabled: off => {
      wrap.classList.toggle("dimmed", off);
      wrap.querySelectorAll("button,input").forEach(x => x.disabled = off);
    }
  };
}

/* ── 합주 달력 ───────────────────────────────────────────────────
   목록은 「언제 뭐가 있나」를 한눈에 보여주지 못합니다. 달력이 그 자리를 메웁니다.
   날짜를 누르면 그날 합주로 바로 갑니다. 여러 개면 목록을 그 달로 좁혀줍니다.

   같은 달력을 두 자리에 그립니다 — 넓은 화면은 오른쪽, 좁은 화면은 본문 위.
   화면 폭에 따라 DOM 을 옮기는 것보다, 둘 다 그려두고 CSS 로 하나만 보이는 쪽이
   창 크기를 바꿀 때 상태가 꼬이지 않습니다. */
let calMonth = null;   // "2026-11" — 못 정했으면 이번 달

function monthKey(d){ return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }

function renderCalendar(){
  const slots = [...document.querySelectorAll(".cal-slot")];
  if (!slots.length) return;

  const today = new Date(todayISO() + "T00:00:00");
  if (!calMonth) calMonth = monthKey(today);
  const [y, m] = calMonth.split("-").map(Number);

  /* 그 달에 무엇이 있는지 모읍니다. 날짜 미정인 합주는 달력에 놓을 자리가 없습니다. */
  const byDay = new Map();
  allEvents.filter(canSeeInList).forEach(e => {
    if (!e.date) return;
    if (e.date.slice(0, 7) !== calMonth) return;
    const d = Number(e.date.slice(8, 10));
    if (!byDay.has(d)) byDay.set(d, []);
    byDay.get(d).push(e);
  });

  const first = new Date(y, m - 1, 1);
  const lead = first.getDay();                 // 1일이 무슨 요일인지
  const days = new Date(y, m, 0).getDate();    // 그 달의 마지막 날
  const isThisMonth = calMonth === monthKey(today);

  const build = () => {
    const box = el("div","cal");

    const head = el("div","cal-head");
    const prev = el("button","cal-nav","‹"); prev.type = "button"; prev.title = "지난달";
    const next = el("button","cal-nav","›"); next.type = "button"; next.title = "다음달";
    prev.onclick = () => { calMonth = monthKey(new Date(y, m - 2, 1)); renderCalendar(); };
    next.onclick = () => { calMonth = monthKey(new Date(y, m, 1)); renderCalendar(); };
    head.append(prev, el("b","", `${y}년 ${m}월`), next);
    box.append(head);

    const grid = el("div","cal-grid");
    ["일","월","화","수","목","금","토"].forEach((n, i) =>
      grid.append(el("div","cal-dow" + (i === 0 ? " sun" : i === 6 ? " sat" : ""), n)));
    for (let i = 0; i < lead; i++) grid.append(el("div","cal-day out",""));

    for (let d = 1; d <= days; d++){
      const list = byDay.get(d) || [];
      const cell = el("div","cal-day"
        + (list.length ? " has" : "")
        + (isThisMonth && d === today.getDate() ? " today" : ""));
      cell.append(el("span","", String(d)));
      if (list.length){
        cell.append(el("span","cal-dot"));
        cell.title = list.map(e => e.title).join("\n");
        cell.setAttribute("role","button");
        cell.tabIndex = 0;
        const go = () => {
          if (list.length === 1){
            const e = list[0];
            location.hash = "#/e/" + e.id
              + (e.visibility === "private" && e.inviteKey ? "/" + e.inviteKey : "");
          } else {
            /* 그날 여러 개면 어느 것인지 고를 수 없습니다. 검색칸을 그 날짜로 좁혀줍니다. */
            const q = `${m}월 ${d}일`;
            $("#list-q").value = q; listQuery = q; renderCards();
            document.querySelector("#event-sheets")?.scrollIntoView({behavior:"smooth", block:"start"});
          }
        };
        cell.onclick = go;
        cell.onkeydown = ev => { if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); go(); } };
      }
      grid.append(cell);
    }
    box.append(grid);

    const n = [...byDay.values()].reduce((a, v) => a + v.length, 0);
    box.append(el("div","cal-foot", n ? `이 달에 합주 ${n}개` : "이 달에는 잡힌 합주가 없습니다"));
    return box;
  };

  slots.forEach(slot => { slot.innerHTML = ""; slot.append(build()); });
}

/* 글이 접힌 칸보다 길면 「…더보기」를 붙입니다.
   길이를 글자 수로 재면 줄바꿈과 화면 폭에 따라 틀립니다. 실제로 잘렸는지만 봅니다. */
let clampSeq = 0;
function setupClamp(elm, host){
  if (!elm || !host) return;
  host.querySelectorAll(".more-btn").forEach(x => x.remove());
  elm.classList.remove("open");
  if (!elm.textContent.trim()) return;

  /* 이 함수는 한 번 그릴 때 여러 번 불립니다. 재는 일을 다음 프레임으로 미루기 때문에,
     그 사이에 또 불리면 먼저 걸어둔 것까지 뒤늦게 버튼을 붙여 두세 개가 생겼습니다.
     가장 마지막 호출만 살아남게 번호를 매깁니다. */
  const mine = ++clampSeq;
  elm.dataset.clamp = String(mine);

  requestAnimationFrame(() => {
    if (elm.dataset.clamp !== String(mine)) return;   // 더 나중 호출이 있었습니다
    if (!elm.isConnected) return;
    host.querySelectorAll(".more-btn").forEach(x => x.remove());
    if (elm.scrollHeight - elm.clientHeight < 4) return;      // 잘리지 않았습니다
    const b = el("button","more-btn","…더보기");
    b.type = "button";
    b.onclick = () => {
      const open = elm.classList.toggle("open");
      b.textContent = open ? "접기" : "…더보기";
    };
    elm.after(b);
  });
}

function songCard(song, done){
  const card = el("article","song");
  card.dataset.songId = song.id;

  const face = el("div","face " + (done ? "done" : "base"));

  if (done){
    face.append(el("span","rail"));
  } else {
    const req = song.requiredParts || [];
    const filled = req.filter(p => song.slots?.[p]).length;
    const bar = el("div","bar");
    const i = el("i","");
    i.style.width = req.length ? Math.round(filled / req.length * 100) + "%" : "0%";
    bar.append(i);
    face.append(bar);
  }

  const pad = el("div","pad");

  const s1 = el("div","s1");
  const t = el("div","t");
  t.append(el("h3","", song.title));
  t.append(el("p","by", [song.artist, song.proposerName ? `${song.proposerName} 추천` : null]
    .filter(Boolean).join(" · ") || "아티스트 미기재"));
  s1.append(t);
  s1.append(songBadge(song, done));
  const tools = songTools(song);
  if (tools.childElementCount){ tools.className = "acts"; s1.append(tools); }
  pad.append(s1);

  if (song.description){
    const d = el("p","song-desc", song.description);
    pad.append(d);
    requestAnimationFrame(() => setupClamp(d, pad));
  }

  if (isUnset(song)){
    const panel = el("div","song-unset");
    panel.append(el("p","","이 곡은 아직 편성이 정해지지 않았습니다. 어떤 파트가 필요한지 아시면 채워주세요."));
    const b = el("button","btn sm primary","편성 채우기");
    b.onclick = () => partsModal(song);
    panel.append(b);
    pad.append(panel);
  } else {
    pad.append(songSlots(song));
  }

  face.append(pad);
  card.append(face);
  return card;
}

/* 일정을 옮길 수 있는지 판단합니다.
   보통은 로그인한 사람 누구나 가능하지만, 이미 합주를 마친 일정에 속한 곡은
   그 일정의 주최자와 관리자만 건드릴 수 있습니다. */



/* 곡을 다른 일정으로 옮깁니다.
   곡은 반드시 어느 일정엔가 속하므로 "빼내기"는 없습니다. 옮기거나, 지우거나입니다. */


/* 이 일정으로 바로 들어오는 주소를 만듭니다.
   비공개 일정은 초대 키가 붙습니다. 키가 없으면 받은 사람이 404 를 봅니다. */
function shareLinkOf(e){
  const base = location.origin + location.pathname;
  const tail = (e.visibility === "private" && e.inviteKey) ? `/${e.inviteKey}` : "";
  return `${base}#/e/${e.id}${tail}`;
}

async function copyShareLink(e){
  const url = shareLinkOf(e);
  try {
    await navigator.clipboard.writeText(url);
    toast(e.visibility === "private" ? "비공개 링크를 복사했습니다" : "링크를 복사했습니다");
  } catch(err){
    /* 클립보드는 https 가 아니거나 권한이 없으면 막힙니다. 그때는 눈으로 보고 복사하게 합니다. */
    prompt("아래 주소를 복사하세요", url);
  }
}

/* 일정을 지웁니다. 주최자와 관리자만 할 수 있습니다(서버에서도 다시 확인합니다).

   확인 창에 곡 개수를 적어 보여주는 이유 —
   곡은 이제 일정 안에만 존재하므로, 일정을 지우면 곡도 같이 사라집니다.
   돌아갈 곳이 없어졌습니다. "일정만 지우는 것"이라고 생각하고 누르면
   남의 곡과 잡아둔 자리까지 날아갑니다. 숫자를 보여주고 한 번 더 묻습니다. */
async function deleteEventFlow(e){
  const n = curSongs.length;
  const 경고 = n
    ? `«${e.title}»을(를) 지웁니다.\n\n이 합주의 곡 ${n}개와 잡혀 있는 자리, 활동 기록도 함께 사라집니다.\n되돌릴 수 없습니다. 진행할까요?`
    : `«${e.title}»을(를) 지웁니다.\n\n되돌릴 수 없습니다. 진행할까요?`;
  if (!confirm(경고)) return;

  try {
    await store.deleteEvent(e.id);
    toast("합주를 지웠습니다");
    location.hash = "#/";
  } catch(err){ console.error(err); toast(errText(err)); }
}

   합주 완료로 표시된 일정을 최근 순으로 모아 보여줍니다. */

function renderMatrix(){
  if (!curEvent) return;

  /* 성립 모션이 도는 중에는 다시 그리지 않습니다.
     서버의 「바뀌었다」 알림 한 번에 이 함수가 여러 번 불립니다. 그때마다 목록을
     통째로 새로 만들면 방금 시작한 모션이 중간에 지워집니다 — 물들다 말거나
     올라가다 끊겨 보이던 것이 이것 때문이었습니다(2초 동안 네 번 불렸습니다).
     모션이 끝나면 스스로 다시 그리므로, 여기서 건너뛰어도 최신 내용을 놓치지 않습니다. */
  if (motionPlaying) return;

  const box = $("#songs");
  box.innerHTML = "";

  const mb = $("#btn-manage");
  mb.classList.toggle("hide", !canManageSlots());
  mb.classList.toggle("ghost", !manageMode);
  mb.textContent = manageMode ? "자리 관리 끄기" : "자리 관리";

  const note = $("#songs-note");
  note.classList.toggle("note-closed", entryClosed());
  const noteText =
      (manageMode && canManageSlots())
        ? "자리 관리 중입니다. 아무 칸이나 눌러 다른 사람을 넣거나 뺄 수 있습니다."
    : eventDone(curEvent)
        ? "합주가 끝난 일정입니다. 아래 곡들이 이날 연주한 기록으로 남아 있습니다."
    : entryClosed()
        ? `${fmtDate(curEvent.entryDeadline)}에 곡 신청이 마감됐습니다. 세트리스트가 확정된 상태입니다.`
        + ((isAdmin() || isEventHost()) ? " 주최자와 관리자는 계속 손볼 수 있습니다." : "")
        : "";
  note.textContent = noteText;
  note.classList.toggle("hide", !noteText);

  if (!curSongs.length){
    const empty = el("div","empty-note");
    empty.append(document.createTextNode("아직 올라온 곡이 없습니다. "));
    const a2 = el("button","btn sm primary","첫 곡 올리기");
    a2.onclick = () => songModal();
    a2.style.marginLeft = "8px";
    empty.append(a2);
    box.append(empty);
    $("#songs-count").textContent = "";
    $("#roster").innerHTML = ""; $("#roster-n").textContent = "";
    renderEventFeed();
    return;
  }

  const byMade = (a,b) => (a.createdAt || 0) - (b.createdAt || 0) || String(a.id).localeCompare(String(b.id));

  /* 성립한 곡은 「먼저 성립한 것이 위」입니다. 올린 순서가 아닙니다 —
     나중에 올린 곡이 먼저 성립했는데 저 아래 남아 있으면 찾기 어렵습니다.
     성립이 풀리면 서버가 그 시각을 지우므로, 다시 성립하면 맨 아래로 붙습니다. */
  const done = curSongs.filter(isDone)
    .sort((a,b) => (a.completedAt || a.createdAt || 0) - (b.completedAt || b.createdAt || 0)
                   || byMade(a,b));

  /* 아직 모집 중인 곡과 편성 미정인 곡은 올린 순서대로입니다. */
  const unset = curSongs.filter(isUnset).sort(byMade);
  const open  = curSongs.filter(sg => !isUnset(sg) && !isDone(sg)).sort(byMade);

  /* 성립한 곡이 위, 그다음 자리 빈 곡, 편성 미정이 아래.
     구역 제목을 따로 두지 않습니다 — 레일과 바탕색만으로 이미 구분됩니다. */
  const ordered = [...done, ...open, ...unset];
  /* 이 화면을 한 번이라도 그린 적이 있어야 「방금 바뀐 것」을 따질 수 있습니다.
     전에는 prevDone.size 로 판단했는데, 그러면 성립한 곡이 하나도 없던 상태에서
     첫 곡이 성립할 때 모션이 통째로 걸러졌습니다 — 곡이 둘뿐일 때 특히 자주 걸립니다. */
  const firstPaint = prevOrderIds.length === 0;
  const newlyDone = firstPaint ? []
    : done.filter(sg => !prevDone.has(sg.id)).map(sg => sg.id);

  /* 자리가 빠져서 성립이 풀린 곡 — 올라갔던 것이 내려와야 합니다. */
  const undone = firstPaint ? []
    : curSongs.filter(sg => prevDone.has(sg.id) && !isDone(sg)).map(sg => sg.id);

  /* 바뀐 곡이 딱 하나일 때만 모션을 겁니다.
     「성립 직전(또는 직후) 화면」을 먼저 그려놓고 거기서 출발합니다.
     - 그 곡은 예전에 있던 자리에 그대로 두고
     - 아직 물들지 않은 모습(.face.base)으로 그립니다
     모션이 끝나면 제자리를 찾아 다시 그립니다. */
  let heroId = null, heroMode = null, drawn = ordered;
  if (prevOrderIds.length && newlyDone.length === 1 && undone.length === 0){
    heroId = newlyDone[0]; heroMode = "done";
  } else if (prevOrderIds.length && undone.length === 1 && newlyDone.length === 0){
    heroId = undone[0]; heroMode = "undone";
  }
  if (heroId){
    const byId = new Map(curSongs.map(sg => [sg.id, sg]));
    const kept = prevOrderIds.map(id => byId.get(id)).filter(Boolean);
    const extra = curSongs.filter(sg => !prevOrderIds.includes(sg.id));
    drawn = [...kept, ...extra];
  }

  drawn.forEach(sg => box.append(songCard(sg, isDone(sg) && sg.id !== heroId)));

  $("#songs-count").textContent =
    `${curSongs.length}곡` + (done.length ? ` · ${done.length}곡 각 나옴` : "");

  prevDone = new Set(done.map(sg => sg.id));
  prevOrderIds = drawn.map(sg => sg.id);
  renderRoster();
  renderEventFeed();

  // 방금 성립한 곡이 있으면 그 칸에 모션을 겁니다.
  if (heroId){
    const card = box.querySelector(`[data-song-id="${heroId}"]`);
    const song = curSongs.find(sg => sg.id === heroId);
    playSongMotion(card, song, heroMode, planMoves(box, drawn, ordered),
      () => { prevOrderIds = ordered.map(sg => sg.id); renderMatrix(); });
  }
}

function renderRoster(){

  curSongs.forEach(sg => Object.entries(sg.slots||{}).forEach(([pt,v]) => {
    if (!v) return;
    const cur = map.get(v.uid) || {name:v.name, photo:v.photo || "", parts:new Set(), n:0};
    if (!cur.photo && v.photo) cur.photo = v.photo;

  $("#roster-n").textContent = map.size || "";
  if (!map.size){ box.append(el("div","fi","아직 아무도 자리를 잡지 않았습니다.")); return; }

  [...map.values()].sort((a,b) => b.n - a.n).forEach(person => {

      r.append(el("i","", (person.name || "?").slice(0,1)));

    r.append(el("span","nm", person.name));
    r.append(el("span","pt", [...person.parts].sort(byPartOrder).join(" · ")));
    box.append(r);
  });
}

/* ── 곡이 성립하는 순간 ──────────────────────────────────
   왼쪽에서 오른쪽으로 물들고, 테두리가 시계방향으로 둘러지고,
   파트 칸마다 선이 차례로 그어진 뒤, 칸이 맨 위로 올라갑니다.

   요소를 겹쳐 쌓지 않고 한 겹만 칠하는 이유: 반투명한 층을 포개면
   그 아래 글자까지 뿌옇게 흐려집니다. 그래서 전부 불투명하게 두고
   글자색은 건드리지 않습니다.

   움직임을 줄이도록 설정한 사람에게는 모션 없이 결과만 보여줍니다. */
/* 지금 그려진 차례(drawn)에서 제자리 차례(ordered)로 갈 때
   각 칸이 세로로 몇 px 움직여야 하는지 미리 계산합니다.

   전에는 성립한 칸을 무조건 맨 위로 올렸습니다. 그런데 차례 규칙은
   「성립 곡이 먼저, 그 안에서는 원래 올린 차례」입니다. 늦게 올린 곡이 성립하면
   맨 위가 아니라 성립 곡 묶음의 끝으로 가야 하는데, 맨 위까지 올라갔다가
   다시 내려오는 일이 생겼습니다. 그래서 갈 자리를 먼저 따져봅니다.

   움직임이 0인 칸은 아예 건드리지 않습니다 — 성립해도 제자리인 곡이 있습니다. */
function planMoves(box, drawn, ordered){
  const GAP = 12;
  const els = [...box.children];
  const h = new Map();
  drawn.forEach((sg, i) => { if (els[i]) h.set(sg.id, els[i].getBoundingClientRect().height); });

  const topsOf = list => {
    const m = new Map(); let y = 0;
    list.forEach(sg => { m.set(sg.id, y); y += (h.get(sg.id) || 0) + GAP; });
    return m;
  };
  const before = topsOf(drawn), after = topsOf(ordered);

  return drawn.map((sg, i) => ({
    el: els[i],
    d: Math.round((after.get(sg.id) ?? 0) - (before.get(sg.id) ?? 0))
  })).filter(m => m.el);
}

/* ── 곡이 성립하는 순간, 그리고 풀리는 순간 ─────────────────────
   성립: 왼쪽에서 오른쪽으로 물들고, 테두리가 시계방향으로 둘러지고,
         파트 칸마다 선이 차례로 그어진 뒤, 제자리로 옮겨갑니다.
   풀림: 그 반대입니다. 색이 오른쪽부터 빠지고 레일이 걷히고 내려갑니다.
         요란하게 할 일이 아니라 테두리 선 같은 것은 넣지 않습니다.

   움직임을 줄이도록 설정한 사람에게는 모션 없이 결과만 보여줍니다. */
function playSongMotion(card, song, mode, moves, onEnd){
  const finish = () => { try { onEnd?.(); } catch(e){ console.error(e); } };
  if (!card || !song){ finish(); return; }

  /* 성립한 모습의 칸을 한 장 더 만들어 위에 겹칩니다.
     목업(motion2.html)과 같은 구조여야 왼쪽부터 물드는 장면이 나옵니다. */
  const doneFace = songCard(song, true).querySelector(".face.done");
  if (!doneFace){ finish(); return; }

  /* 성립 카드에는 위쪽 진행 막대가 없고 모집 중 카드에는 있습니다(3px).
     두 겹을 그냥 포개면 글자가 그만큼 어긋나 겹쳐 보입니다. 맞춰 줍니다. */
  const barH = card.querySelector(".face.base .bar")?.getBoundingClientRect().height || 0;
  if (barH) doneFace.style.paddingTop = barH + "px";

  const undo = mode === "undone";
  if (undo) doneFace.style.clipPath = "inset(0 0% 0 0)";   // 색이 다 차 있는 데서 시작

  card.appendChild(doneFace);
  card.classList.add("hero");
  motionPlaying = true;

  const cleanup = () => {
    motionPlaying = false;
    card.classList.remove("hero");
    card.querySelectorAll(".ring, .edge").forEach(x => x.remove());
    finish();
  };

  if (window.matchMedia?.("(prefers-reduced-motion: reduce)").matches){ cleanup(); return; }

  const box = card.getBoundingClientRect();
  if (!box.width){ cleanup(); return; }

  const SMOOTH = 'cubic-bezier(.19,.85,.22,1)';
  const DRAW   = 'cubic-bezier(.32,.72,.26,1)';
  const W = box.width;
  const add = (el2, f, o) => el2.animate(f, {fill:'both', ...o});

  /* 테두리를 시계방향으로 그리는 SVG 한 장 만들기 */
  function ring(x, y, w, h, r, sw){
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns,'svg');
    svg.setAttribute('class','ring');
    Object.assign(svg.style, {left:x+'px', top:y+'px', width:w+'px', height:h+'px'});
    const rect = document.createElementNS(ns,'rect');
    const i2 = sw/2;
    rect.setAttribute('x',i2); rect.setAttribute('y',i2);
    rect.setAttribute('width', w-sw); rect.setAttribute('height', h-sw);
    rect.setAttribute('rx', Math.min(r, (h-sw)/2));
    rect.setAttribute('pathLength','100');          /* 실제 둘레를 계산할 필요가 없다 */
    rect.setAttribute('stroke-width', sw);
    svg.appendChild(rect); card.appendChild(svg);
    return rect;
  }

  let colourEnds;      /* 색이 다 변하는 시각 */

  if (!undo){
    /* 0. 왼쪽 레일이 위에서 아래로 그어진다 — 여기서 색이 퍼져나간다 */
    add(doneFace.querySelector('.rail'),
      [{transform:'scaleY(0)'},{transform:'scaleY(1)'}],
      {duration:340, easing:'cubic-bezier(.2,.8,.25,1)'});

    /* 1. 칸이 왼쪽부터 물든다 */
    add(doneFace,
      [{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0% 0 0)'}],
      {duration:760, delay:120, easing:SMOOTH});

    /* 2. 물드는 경계의 빛 */
    const edge = el("span","edge");
    card.appendChild(edge);
    add(edge,
      [{transform:'translateX(0)',opacity:0,offset:0},{opacity:.9,offset:.12},
       {opacity:.9,offset:.82},{transform:'translateX('+(W+140)+'px)',opacity:0,offset:1}],
      {duration:760, easing:SMOOTH});

    /* 3. 숨 */
    add(card, [{transform:'scale(1)'},{transform:'scale(1.012)',offset:.42},{transform:'scale(1)'}],
        {duration:840, easing:SMOOTH});

    /* 4. 칸 테두리가 시계방향으로 둘러진다 */
    const cardRing = ring(0, 0, box.width, box.height, 14, 1.6);
    add(cardRing, [{strokeDashoffset:100},{strokeDashoffset:0}],
        {duration:820, delay:160, easing:DRAW});
    add(cardRing, [{opacity:1},{opacity:1}], {duration:1});

    /* 5. 파트 타원마다 얇은 선이 — 물드는 경계가 지나간 순서대로 */
    [...doneFace.querySelectorAll('.chip')].forEach(c => {
      const b = c.getBoundingClientRect();
      const x = b.left - box.left, y = b.top - box.top;
      const r = ring(x, y, b.width, b.height, 999, 1.1);
      add(r, [{strokeDashoffset:100},{strokeDashoffset:0}],
          {duration:420, delay:180 + (x / W) * 620, easing:DRAW});
    });
    colourEnds = 980;
  } else {
    /* 풀림 — 색이 오른쪽부터 빠지고, 레일이 위로 걷힙니다. */
    add(doneFace,
      [{clipPath:'inset(0 0% 0 0)'},{clipPath:'inset(0 100% 0 0)'}],
      {duration:620, easing:SMOOTH});
    add(doneFace.querySelector('.rail'),
      [{transform:'scaleY(1)'},{transform:'scaleY(0)'}],
      {duration:300, delay:320, easing:'cubic-bezier(.2,.8,.25,1)'});
    colourEnds = 640;
  }

  /* 6. 제자리로 옮겨갑니다 — 올라갈 수도, 내려갈 수도, 가만히 있을 수도 있습니다.
        움직일 칸이 하나도 없으면 색만 바꾸고 끝냅니다. */
  const moving = (moves || []).filter(m => m.d !== 0);
  const MOVE_DUR = undo ? 560 : 660;

  if (!moving.length){
    setTimeout(cleanup, colourEnds + 120);
    return;
  }

  const mine = moving.find(m => m.el === card);
  if (mine){
    /* 지나가는 동안 살짝 떠오릅니다 — 안 그러면 옆 칸과 겹쳐 보입니다. */
    add(doneFace,
      [{boxShadow:'0 1px 2px rgba(20,18,23,.05)'},
       {boxShadow:'0 14px 34px rgba(20,18,23,.16)',offset:.45},
       {boxShadow:'0 1px 2px rgba(20,18,23,.05)'}],
      {duration:MOVE_DUR + 100, delay:colourEnds - 30, easing:SMOOTH});
  }

  let last = null;
  moving.forEach(m => {
    last = add(m.el, [{translate:'0 0'},{translate:'0 ' + m.d + 'px'}],
               {duration:MOVE_DUR, delay:colourEnds, easing:SMOOTH});
  });
  last.addEventListener("finish", cleanup, {once:true});
  setTimeout(() => { if (card.isConnected && card.classList.contains("hero")) cleanup(); },
             colourEnds + MOVE_DUR + 600);
}

function modal(html, onMount, locked){
  const root = $("#modal-root");
  root.innerHTML = `<div class="modal-bg"><div class="modal">${html}</div></div>`;
  if (!locked){
    const bg = root.querySelector(".modal-bg");

    // 배경을 눌렀다 뗐을 때만 닫습니다.
    //
    // click 이벤트는 "누른 곳"과 "뗀 곳"의 공통 부모에서 일어납니다.
    // 그래서 입력창 안에서 누른 채로 바깥까지 끌고 나가 떼면,
    // 공통 부모가 배경이 되어 click 의 target 이 배경으로 잡힙니다.
    // 글자를 드래그로 선택하려던 것뿐인데 창이 닫혀버리던 이유입니다.
    //
    // 누른 지점이 배경이었는지를 따로 기억해 두면 그 경우가 걸러집니다.
    let pressedOnBg = false;
    bg.addEventListener("mousedown", e => { pressedOnBg = (e.target === bg); });
    bg.addEventListener("click", e => {
      if (pressedOnBg && e.target === bg) closeModal();
      pressedOnBg = false;
    });

    document.addEventListener("keydown", escClose);
  }
  onMount?.(root);
  root.querySelector("input,select,textarea")?.focus();
}
function closeModal(){ $("#modal-root").innerHTML = ""; document.removeEventListener("keydown", escClose); }
function escClose(e){ if (e.key === "Escape") closeModal(); }

function profileModal({first = false} = {}){
  if (!auth.user) return;
  /* 지역·파트가 비어 있으면 myProfile 은 null 입니다(아직 프로필을 다 쓰지 않은 것).
     그래도 가입할 때 적은 닉네임·메일은 서버에 있으니 auth.user 에서 꺼내 미리 채웁니다.
     두 번 적게 하지 않으려는 것이고, 창에서 그대로 고칠 수 있습니다. */
  const p = myProfile || { name: auth.user.name, email: auth.user.email, photo: auth.user.photo };
  let photo = p.photo || "";
  const parts = new Set(p.parts || (p.part ? [p.part] : []));

  modal(`
    <h3>${first ? "프로필 만들기" : "회원 정보"}</h3>
    <p class="hint">${first
      ? "합주에 참가하려면 먼저 프로필이 필요합니다. 나중에 언제든 고칠 수 있습니다."
      : "고친 내용은 저장하는 즉시 반영됩니다."}</p>

    <div class="ava-row">
      <img id="p-preview" class="ava-big" alt="프로필 이미지 미리보기">
      <div>
        <label class="btn sm" for="p-file" style="display:inline-block">이미지 올리기</label>
        <input id="p-file" type="file" accept="image/*" style="display:none">
        <button class="btn sm ghost" id="p-clear" type="button">지우기</button>
        <p class="ava-note">올린 뒤 원하는 부분을 직접 자를 수 있습니다.</p>
      </div>
    </div>

    <div class="field"><label>닉네임 <b class="req">필수</b></label>
      <input id="p-name" maxlength="20" placeholder="합주에서 불릴 이름" value="${esc(p.name || "")}"></div>

    <div class="field"><label>메일 주소 <b class="req">필수</b></label>
      <input id="p-email" type="email" maxlength="80" placeholder="name@example.com" value="${esc(p.email || auth.user.email || "")}">
      <p class="ava-note">주최자 연락용입니다. 다른 참가자에게는 보이지 않습니다.</p></div>

    <div class="field"><label>연주 파트 <b class="req">필수</b></label>
      <div class="partpick" id="p-parts"></div>
      <p class="ava-note">할 수 있는 파트를 모두 골라주세요. 여러 개 선택할 수 있습니다.</p></div>

    <div class="field"><label>활동 지역 <b class="req">필수</b></label>
      <select id="p-region">
        <option value="">선택하세요</option>
        ${AREAS.map(a => `<option${p.region === a ? " selected" : ""}>${a}</option>`).join("")}
      </select></div>

    <div class="field"><label>자기소개</label>
      <textarea id="p-bio" maxlength="1000" placeholder="연주 경력, 좋아하는 밴드, 합주 가능한 요일 등">${esc(p.bio || "")}</textarea></div>

    ${first ? "" : `
    <div class="field">
      <label>계정 연결</label>
      <p class="hint">연결해 두면 어느 쪽으로 눌러도 같은 계정으로 들어옵니다.</p>
      <div class="links" id="p-links"><span class="hint">불러오는 중…</span></div>
    </div>`}

    <div class="err" id="p-err"></div>
    ${first ? "" : `<p class="ava-note mono" style="font-size:11px">내 UID · ${esc(auth.user.uid)}</p>`}
    <div class="modal-actions">
      ${first
        ? `<button class="btn ghost" id="p-out">취소</button>`
        : `<button class="btn ghost" id="p-quit" style="color:var(--danger);margin-right:auto">탈퇴하기</button>
           <button class="btn ghost" id="p-out">로그아웃</button><button class="btn ghost" id="p-cancel">닫기</button>`}
      <button class="btn primary" id="p-save">${first ? "가입 마치기" : "저장하기"}</button>
    </div>`, root => {

    const prev = root.querySelector("#p-preview");
    const err  = root.querySelector("#p-err");
    const paint = () => { prev.src = photo || blankAvatar(root.querySelector("#p-name").value); };
    paint();

    root.querySelector("#p-name").oninput = () => { if (!photo) paint(); };

    root.querySelector("#p-file").onchange = async e => {
      const f = e.target.files?.[0]; if (!f) return;
      err.textContent = "";
      const label = root.querySelector('label[for="p-file"]');
      try {
        const url = await pickProfilePhoto(f);
        if (url){ photo = url; paint(); }
      } catch(ex){ err.textContent = ex.message || "이미지를 올리지 못했습니다"; }
      finally { if (label) label.textContent = "이미지 올리기"; }
      e.target.value = "";
    };
    root.querySelector("#p-clear").onclick = () => { photo = ""; paint(); };

    const pbox = root.querySelector("#p-parts");
    MY_PARTS.forEach(x => {
      const b = el("button","" + (parts.has(x) ? "on" : ""), x);
      b.type = "button";
      b.onclick = () => {
        parts.has(x) ? parts.delete(x) : parts.add(x);
        b.classList.toggle("on");
      };
      pbox.append(b);
    });

    root.querySelector("#p-out").onclick = () => { closeModal(); auth.signOut(); };
    root.querySelector("#p-cancel")?.addEventListener("click", closeModal);

    /* 계정 연결 칸을 그립니다.
       서버가 「지금 무엇이 연결돼 있는지」만 알려주고, 어떤 제공자가 있는지는
       화면이 압니다(SOCIAL_PROVIDERS). 키를 안 넣은 제공자는 아예 빼둡니다. */
    async function drawLinks(){
      const box = root.querySelector("#p-links");
      if (!box) return;
      let linked = [];
      try { linked = await store.authLinks(); }
      catch(e){ box.innerHTML = `<span class="hint">연결 상태를 불러오지 못했습니다</span>`; return; }

      box.textContent = "";
      SOCIAL_PROVIDERS.filter(sp => sp.enabled).forEach(sp => {
        const on = linked.includes(sp.id.toUpperCase());
        const row = el("div", "link-row");
        /* 로그인 버튼과 같은 방식입니다 — 공식 이미지가 있으면 그걸,
           아직 안 받았으면 머리글자로 떨어집니다. */
        const mk = el("img", "link-mark " + sp.cls);
        mk.src = sp.icon;
        mk.alt = "";
        mk.onerror = () => mk.replaceWith(el("span", "link-mark " + sp.cls, sp.mark));
        row.append(mk);
        row.append(el("span", "link-name", sp.label.replace(" 계정으로 로그인", "")));

        const b = el("button", "btn sm " + (on ? "ghost" : ""), on ? "연결 끊기" : "연결하기");
        b.type = "button";
        if (on) b.style.color = "var(--danger)";
        b.onclick = async () => {
          b.disabled = true;
          if (on){
            /* 마지막 하나를 끊으면 들어올 길이 없어집니다.
               서버도 막지만, 눌러보고 거절당하는 것보다 먼저 알려주는 편이 낫습니다. */
            if (!confirm(`${sp.label.replace(" 계정으로 로그인", "")} 연결을 끊을까요?\n\n`
              + "이 방법으로는 더 이상 로그인할 수 없게 됩니다.")) { b.disabled = false; return; }
            try { await store.unlinkSocial(sp.id); toast("연결을 끊었습니다"); }
            catch(e){ toast(e.message || "끊지 못했습니다"); }
            b.disabled = false;
            return drawLinks();
          }
          const done = async () => { b.disabled = false; await drawLinks(); };
          if (sp.id === "google"){
            requestGoogleCode(async code => {
              try { await call("POST", "/auth/link/google", { code }); toast("연결했습니다"); }
              catch(e){ toast(e.message || "연결하지 못했습니다"); }
              await done();
            }, msg => { toast(msg); b.disabled = false; });
          } else if (sp.id === "kakao"){
            startPopupLogin("kakao", kakaoAuthUrl, "link", done);
            b.disabled = false;
          } else if (sp.id === "naver"){
            startPopupLogin("naver", naverAuthUrl, "link", done);
            b.disabled = false;
          }
        };
        row.append(b);
        box.append(row);
      });
      if (!box.children.length) box.innerHTML = `<span class="hint">연결할 수 있는 계정이 없습니다</span>`;
    }
    drawLinks();

    /* 탈퇴.
       되돌릴 수 없고 사람이 실수로 누르기 쉬운 자리라, 닉네임을 직접 치게 합니다.
       「예/아니오」 한 번은 손이 먼저 움직이지만, 글자를 옮겨 적는 동안에는 읽게 됩니다. */
    root.querySelector("#p-quit")?.addEventListener("click", async () => {
      const name = myProfile?.name || auth.user.name || "";
      const typed = prompt(
        "탈퇴하면 이메일·비밀번호·지역·소개·사진이 DB에서 지워집니다. 되돌릴 수 없습니다.\n\n"
        + "· 올린 곡과 남긴 기록은 「탈퇴한 사용자」로 남습니다\n"
        + "· 잡고 있던 자리는 비워집니다 (성립된 곡은 성립이 풀립니다)\n"
        + "· 같은 메일로 다시 가입할 수 있지만, 예전 기록과는 이어지지 않습니다\n\n"
        + `계속하려면 닉네임 「${name}」 을 그대로 적어주세요.`);
      if (typed === null) return;
      if (typed.trim() !== name){ toast("닉네임이 달라서 그만두었습니다"); return; }
      try {
        await store.withdraw();
        closeModal();
        auth.signOut();
        toast("탈퇴했습니다. 그동안 고마웠습니다");
      } catch(ex){ err.textContent = ex.message || "탈퇴하지 못했습니다"; }
    });

    root.querySelector("#p-save").onclick = async () => {
      const name   = root.querySelector("#p-name").value.trim();
      const email  = root.querySelector("#p-email").value.trim();
      const region = root.querySelector("#p-region").value;
      const bio    = root.querySelector("#p-bio").value.trim();

      if (name.length < 2)  return err.textContent = "닉네임을 두 글자 이상 적어주세요.";
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return err.textContent = "메일 주소 형식을 확인해 주세요.";
      if (!parts.size) return err.textContent = "연주 파트를 하나 이상 골라주세요.";
      if (!region) return err.textContent = "활동 지역을 골라주세요.";

      err.textContent = "";
      root.querySelector("#p-save").textContent = "저장 중";
      try {
        const data = {name, email, parts: MY_PARTS.filter(x => parts.has(x)), region, bio, photo};
        if (first) data.joinedAt = Date.now();
        await store.saveProfile(auth.user.uid, data);
        myProfile = data;
        closeModal(); renderAuth(auth.user);
        if (curEvent) renderMatrix();
        toast(first ? "가입이 끝났습니다" : "회원 정보를 저장했습니다");
      } catch(ex){
        root.querySelector("#p-save").textContent = first ? "가입 마치기" : "저장하기";
        err.textContent = "저장하지 못했습니다. 잠시 후 다시 시도해 주세요.";
      }
    };
  }, first);
}

let adminUsers = [], adminTab = "dash", adminQ = "";

async function openAdmin(){
  if (!isAdmin()){ location.hash = "#/"; toast("관리자만 볼 수 있습니다"); return; }
  showView("admin");
  document.title = "관리자 — 합주각";
  window.scrollTo(0,0);
  renderAdmin();
  try { adminUsers = await store.listUsers(); }
  catch(e){ adminUsers = null; }
  renderAdmin();
}

function adminStats(){
  const today = todayISO();
  let songs = 0, done = 0, unset = 0, claims = 0;
  const people = new Set();
  allEvents.forEach(e => songsOf(e.id).forEach(sg => {
    songs++;
    if (isUnset(sg)) unset++; else if (isDone(sg)) done++;
    Object.values(sg.slots||{}).forEach(v => { if (v){ claims++; people.add(v.uid); } });
  }));
  return {
    users: adminUsers ? adminUsers.length : "—",
    events: allEvents.length,
    upcoming: allEvents.filter(e => !e.date || e.date >= today).length,
    hidden: allEvents.filter(e => e.visibility === "private").length,
    songs, done, unset, claims, active: people.size
  };
}

function dist(list, key){
  const m = new Map();
  list.forEach(u => {
    const vals = key === "parts" ? (u.parts || (u.part ? [u.part] : [])) : [u[key]];
    vals.filter(Boolean).forEach(v => m.set(v, (m.get(v)||0) + 1));
  });
  return [...m.entries()].sort((a,b) => b[1] - a[1]);
}

function renderAdmin(){
  const box = $("#admin-body");
  box.innerHTML = "";

  const tabs = el("div","admin-tabs");

function adminDash(box){
  const st = adminStats();

  [
    ["가입 회원", st.users], ["활동 중", st.active + "명"],
    ["전체 합주", st.events], ["예정 합주", st.upcoming],
    ["비공개 합주", st.hidden], ["등록 곡", st.songs],
    ["성립 곡", st.done], ["편성 미정", st.unset],
    ["잡힌 자리", st.claims]
  ].forEach(([k,v]) => {
    const c = el("div","stat");
    c.append(el("b","",String(v)));
    c.append(el("span","",k));
    grid.append(c);
  });
  box.append(grid);

  const bars = (title, rows, total) => {
    if (!rows.length) return;
    box.append(el("div","form-sec",title));
    const wrap = el("div","bars");
    rows.forEach(([label,n]) => {
      const r = el("div","bar-row");
      r.append(el("span","bar-l",label));
      const track = el("div","bar-t");
      const fill = el("i");
      fill.style.width = Math.max(3, Math.round(n/total*100)) + "%";
      track.append(fill);
      r.append(track);
      r.append(el("span","bar-n mono",String(n)));
      wrap.append(r);
    });
    box.append(wrap);
  };
  const total = Math.max(1, adminUsers.length);
  bars("파트 분포", dist(adminUsers,"parts"), total);
  bars("지역 분포", dist(adminUsers,"region"), total);
}

    MY_PARTS.forEach(x => {
      const b = el("button","" + (parts.has(x) ? "on" : ""), x); b.type = "button";
      b.onclick = () => { parts.has(x) ? parts.delete(x) : parts.add(x); b.classList.toggle("on"); };
      pbox.append(b);
    });

    root.querySelector("#au-cancel").onclick = closeModal;
    root.querySelector("#au-save").onclick = async () => {
      const err = root.querySelector("#au-err");
      const name = root.querySelector("#au-name").value.trim();
      if (name.length < 2) return err.textContent = "닉네임을 두 글자 이상 적어주세요.";
      const patch = {
        name,
        email: root.querySelector("#au-email").value.trim(),
        parts: MY_PARTS.filter(x => parts.has(x)),
        region: root.querySelector("#au-region").value,
        bio: root.querySelector("#au-bio").value.trim(),
        photo
      };
      try {

        closeModal(); renderAdmin(); toast("회원 정보를 저장했습니다");
      } catch(e){ err.textContent = "저장하지 못했습니다. 관리자만 바꿀 수 있습니다."; }
    };
  });
}

function adminEventsTab(box){
  const search = el("div","field");
  const inp = document.createElement("input");
  inp.placeholder = "합주 이름, 지역, 합주실, 주최자로 찾기";
