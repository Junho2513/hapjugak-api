<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>로그인 중 — 합주각</title>
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;
       font-family:Pretendard,system-ui,-apple-system,sans-serif;
       background:#F6F4F1;color:#1A1720}
  @media (prefers-color-scheme:dark){ body{background:#16131B;color:#F2EEE8} }
  .box{text-align:center;padding:24px}
  .dot{width:34px;height:34px;margin:0 auto 16px;border-radius:50%;
       border:3px solid rgba(247,130,46,.25);border-top-color:#F7822E;
       animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  p{margin:0;font-size:14.5px;font-weight:600;letter-spacing:-0.02em}
  .sub{margin-top:8px;font-size:12.5px;opacity:.65;font-weight:500}
</style>
</head>
<body>
<div class="box">
  <div class="dot" id="spin"></div>
  <p id="msg">로그인하는 중입니다</p>
  <p class="sub" id="sub">이 창은 곧 닫힙니다</p>
</div>

<script>
/* 카카오·네이버가 로그인을 마치고 돌아오는 자리입니다.

   구글은 이 페이지가 필요 없습니다. 구글이 띄우는 팝업은 코드를 부모 창에
   직접 건네주거든요(ux_mode: popup). 카카오와 네이버는 그 방법이 없고
   "이 주소로 보내주겠다"는 리다이렉트만 지원합니다. 그래서 받을 자리가 하나 필요합니다.

   여기서 하는 일은 딱 하나, 받은 것을 부모 창에 넘기고 닫는 것입니다.
   코드를 서버에 보내는 것도, 토큰을 저장하는 것도 부모 창이 합니다 —
   이 페이지는 로그인 상태를 만들지 않습니다.

   state 를 대조하는 것도 부모 창입니다. 띄울 때 만든 값을 부모가 들고 있어서,
   여기서는 비교할 상대가 없습니다. */
(function () {
  var q = new URLSearchParams(location.search);
  var payload = {
    source: "hapjugak-oauth",
    code:  q.get("code"),
    state: q.get("state"),
    error: q.get("error") || q.get("error_description") || null
  };

  /* 부모 창이 없으면 — 주소를 직접 치고 들어왔거나, 팝업 차단으로 같은 탭에서
     열렸거나 한 경우입니다. 그때는 넘길 곳이 없으니 안내만 하고 멈춥니다. */
  if (!window.opener || window.opener.closed) {
    document.getElementById("spin").style.display = "none";
    document.getElementById("msg").textContent = "이 페이지는 혼자 쓰는 곳이 아닙니다";
    document.getElementById("sub").innerHTML =
      '<a href="/" style="color:#F7822E">합주각으로 돌아가기</a>';
    return;
  }

  /* 받는 쪽(부모)도 origin 을 확인합니다. 양쪽에서 좁혀두면
     다른 사이트가 끼어들어 가짜 코드를 흘려넣을 수 없습니다. */
  try {
    window.opener.postMessage(payload, location.origin);
  } catch (e) {
    /* 넘기지 못했어도 창은 닫습니다. 부모 창이 기다리다 시간이 지나면
       스스로 "로그인을 끝내지 못했습니다"로 끝냅니다. */
  }
  window.close();
})();
</script>
</body>
</html>
