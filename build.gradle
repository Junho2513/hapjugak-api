plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'hapjugak-api'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // 요청 본문 검증(@Valid). 이게 없으면 @NotBlank 같은 표시가 달려 있어도 아무 일도 하지 않습니다.
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // API 문서 자동 생성. 3.x 가 Spring Boot 4 를 지원합니다(2.x 는 Boot 3 까지).
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
    implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.4.0'
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    // Spring Boot 4부터 자동설정이 기술별 모듈로 분리됐습니다.
    // flyway-core 만 넣으면 라이브러리는 있어도 Boot가 켜주지 않습니다.
    implementation 'org.springframework.boot:spring-boot-starter-flyway'

    // AWS SDK는 Spring Boot가 버전을 관리해주지 않아 BOM을 직접 가져옵니다.
    implementation platform('software.amazon.awssdk:bom:2.46.7')
    implementation 'software.amazon.awssdk:s3'
    // 메일 발송. SMTP 대신 API를 쓰면 서버에 SMTP 비밀번호를 두지 않아도 됩니다.
    implementation 'software.amazon.awssdk:sesv2'

    annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.4.0:jpa'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.7'
    runtimeOnly 'com.mysql:mysql-connector-j'
    // Flyway 8.2부터 DB별 지원이 모듈로 쪼개졌습니다. MySQL은 이게 따로 필요합니다.
    runtimeOnly 'org.flywaydb:flyway-mysql'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}