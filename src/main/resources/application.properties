spring.application.name=hapjugak-api

server.servlet.context-path=/api

spring.datasource.url=jdbc:mysql://localhost:3306/hapjugak?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# 스키마를 만드는 건 Flyway입니다. Hibernate는 엔티티와 맞는지 확인만 합니다.
# 어긋나면 서버가 아예 뜨지 않습니다 — 조용히 틀린 채 도는 것보다 낫습니다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# 이미 2개월 반 돌아간 DB입니다. 지금 상태를 V1으로 "기록만" 하고 넘어갑니다.
# V1 파일은 빈 DB에서만 실제로 실행됩니다.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=운영 중이던 스키마

spring.web.resources.static-locations=classpath:/static/,file:frontend/

# 업로드되는 이미지는 이미 브라우저에서 줄여서 보냅니다.
# 아래 한도는 "그걸 우회한 요청"을 막는 상한선입니다.
app.s3.bucket=hapjugak-media
app.s3.region=ap-southeast-2
app.s3.public-base-url=https://hapjugak-media.s3.ap-southeast-2.amazonaws.com
app.s3.presign-minutes=5

# 기본값을 두지 않습니다. 환경변수가 없으면 서버가 아예 뜨지 않습니다.
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=120

google.client-id=${GOOGLE_CLIENT_ID:1012332237618-84qdq4jcvj9s7torlkqojjbss6n3j4kn.apps.googleusercontent.com}
# 인가 코드를 ID 토큰으로 교환할 때 씁니다. 기본값을 두지 않습니다 - 없으면 서버가 뜨지 않습니다.
google.client-secret=${GOOGLE_CLIENT_SECRET}

# ── API 문서 ──────────────────────────────────────────────
# 주소는 context-path(/api) 뒤에 붙습니다 - 실제로는 /api/docs 입니다.
springdoc.swagger-ui.path=/docs
# 엔드포인트를 메서드 순(GET → POST → PUT → PATCH → DELETE)으로 정렬합니다.
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
# 호출해본 요청이 몇 ms 걸렸는지 보여줍니다.
springdoc.swagger-ui.display-request-duration=true
# "실행해보기"로 보낸 요청의 curl 명령을 같이 보여줍니다.
springdoc.swagger-ui.show-common-extensions=true
