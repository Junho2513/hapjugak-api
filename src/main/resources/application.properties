spring.application.name=hapjugak-api

server.servlet.context-path=/api

# https -> nginx -> http -> 스프링 구조입니다.
# 이게 없으면 스프링은 자기가 http 로 불린 줄 알고, 만들어내는 주소마다 http 를 붙입니다.
#   - 201 Created 의 Location 헤더
#   - Swagger 가 "요청을 보낼 주소"로 쓰는 값
# 둘 다 https 페이지에서 차단됩니다.
# nginx 가 X-Forwarded-Proto 를 보내주고 있고, 컨테이너 포트가 127.0.0.1 에만 묶여 있어
# nginx 말고는 그 헤더를 위조해 보낼 수 있는 경로가 없습니다. 그래서 믿어도 됩니다.
server.forward-headers-strategy=framework

# ── 헬스체크 ─────────────────────────────────────────────────────────
# 배포 스크립트가 "새 컨테이너가 떴는지"를 물어보는 곳입니다.
# 주소는 context-path 뒤에 붙으므로 /api/actuator/health 입니다.
#
# 관리용 포트를 따로 빼는 방법도 있지만(management.server.port), 그러면
# 그 포트에 보안 필터가 붙는지가 설정에 따라 달라집니다. 401 이 나면
# 배포가 영영 성공하지 못하는데, 그건 배포 때나 알게 됩니다.
# 같은 포트에 두고 SecurityConfig 에서 한 줄로 열어두는 쪽이 눈에 보입니다.
#
# health 하나만 엽니다. env 나 beans 같은 것은 설정값과 구조를 그대로 보여줍니다.
management.endpoints.web.exposure.include=health

# 어느 DB 가 죽었는지 같은 내용은 돌려주지 않습니다. UP 이냐 아니냐만 필요합니다.
# 이 주소는 nginx 를 통해 바깥에서도 보이는데, 돌려주는 것이
# {"status":"UP"} 한 줄뿐이라 열려 있어도 알려줄 것이 없습니다.
management.endpoint.health.show-details=never

# liveness(살아 있나)와 readiness(요청 받을 준비가 됐나)를 나눠서 냅니다.
# 무중단 배포가 봐야 하는 것은 readiness 입니다 — JVM 이 떴다는 것과
# Flyway 가 끝나고 DB 연결이 잡혔다는 것은 다릅니다. 포트가 열린 순간
# 트래픽을 넘기면 사용자가 503 을 봅니다.
management.endpoint.health.probes.enabled=true

spring.datasource.url=jdbc:mysql://localhost:3306/hapjugak?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# 스키마를 만드는 건 Flyway입니다. Hibernate는 엔티티와 맞는지 확인만 합니다.
# 어긋나면 서버가 아예 뜨지 않습니다 — 조용히 틀린 채 도는 것보다 낫습니다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# 이미 2개월 반 돌아간 DB입니다. 지금 상태를 V1으로 "기록만" 하고 넘어갑니다.
# V1 파일은 빈 DB에서만 실제로 실행됩니다.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=운영 중이던 스키마

spring.web.resources.static-locations=classpath:/static/,file:frontend/

# 업로드되는 이미지는 이미 브라우저에서 줄여서 보냅니다.
# 아래 한도는 "그걸 우회한 요청"을 막는 상한선입니다.
app.s3.bucket=hapjugak-media
app.s3.region=ap-southeast-2
app.s3.public-base-url=https://hapjugak-media.s3.ap-southeast-2.amazonaws.com
app.s3.presign-minutes=5

# 기본값을 두지 않습니다. 환경변수가 없으면 서버가 아예 뜨지 않습니다.
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=120

google.client-id=${GOOGLE_CLIENT_ID:1012332237618-84qdq4jcvj9s7torlkqojjbss6n3j4kn.apps.googleusercontent.com}
# 인가 코드를 ID 토큰으로 교환할 때 씁니다. 기본값을 두지 않습니다 - 없으면 서버가 뜨지 않습니다.
google.client-secret=${GOOGLE_CLIENT_SECRET}

# ── 메일(SES) ────────────────────────────────────────────
# 발신 주소는 IAM 정책(hapjugak-ses-send)의 조건과 글자까지 같아야 합니다.
# 다르면 AccessDenied 로 막힙니다 - 그게 이 정책의 목적입니다.
app.mail.region=ap-southeast-2
app.mail.from-address=noreply@hapjugak.com
# 메일 안의 로고는 받는 사람 메일 앱이 직접 가져갑니다. 공개로 열려 있어야 합니다.
app.mail.logo-url=https://hapjugak-media.s3.ap-southeast-2.amazonaws.com/brand/hapjugak-logo-128.png

# ── API 문서 ──────────────────────────────────────────────
# 주소는 context-path(/api) 뒤에 붙습니다 - 실제로는 /api/docs 입니다.
springdoc.swagger-ui.path=/docs
# 엔드포인트를 메서드 순(GET → POST → PUT → PATCH → DELETE)으로 정렬합니다.
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
# 호출해본 요청이 몇 ms 걸렸는지 보여줍니다.
springdoc.swagger-ui.display-request-duration=true
# "실행해보기"로 보낸 요청의 curl 명령을 같이 보여줍니다.
springdoc.swagger-ui.show-common-extensions=true
