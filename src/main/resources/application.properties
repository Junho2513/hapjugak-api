spring.application.name=hapjugak-api

server.servlet.context-path=/api

spring.datasource.url=jdbc:mysql://localhost:3306/hapjugak?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# 스키마를 만드는 건 Flyway입니다. Hibernate는 엔티티와 맞는지 확인만 합니다.
# 어긋나면 서버가 아예 뜨지 않습니다 — 조용히 틀린 채 도는 것보다 낫습니다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# 이미 2개월 반 돌아간 DB입니다. 지금 상태를 V1으로 "기록만" 하고 넘어갑니다.
# V1 파일은 빈 DB에서만 실제로 실행됩니다.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=운영 중이던 스키마

spring.web.resources.static-locations=classpath:/static/,file:frontend/

# 기본값을 두지 않습니다. 환경변수가 없으면 서버가 아예 뜨지 않습니다.
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=120

google.client-id=${GOOGLE_CLIENT_ID:1012332237618-84qdq4jcvj9s7torlkqojjbss6n3j4kn.apps.googleusercontent.com}