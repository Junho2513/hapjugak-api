<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f4f5;">
  <tr>
    <td align="center" style="padding:32px 16px;">

      <table role="presentation" width="480" cellpadding="0" cellspacing="0" border="0" style="width:480px;max-width:100%;background:#ffffff;border:1px solid #e8e8ea;border-radius:14px;">

        <!-- 로고 -->
        <tr>
          <td align="center" style="padding:32px 32px 0 32px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="padding-right:10px;" valign="middle">
                  <img src="{{LOGO}}" width="44" height="44" alt="합주각"
                       style="display:block;width:44px;height:44px;border:0;">
                </td>
                <td valign="middle" style="font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:20px;font-weight:700;color:#141217;letter-spacing:-0.5px;">
                  합주각
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- 제목 -->
        <tr>
          <td style="padding:26px 32px 0 32px;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:19px;font-weight:700;color:#141217;letter-spacing:-0.4px;line-height:1.45;">
            {{HEADLINE}}
          </td>
        </tr>

        <!-- 안내 -->
        <tr>
          <td style="padding:10px 32px 0 32px;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:14px;color:#5c5c63;line-height:1.7;">
            {{LEAD}}
          </td>
        </tr>

        <!-- 인증번호 -->
        <tr>
          <td style="padding:22px 32px 0 32px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                   style="background:#f9ede3;border:1px solid #f0d6bd;border-radius:10px;">
              <tr>
                <td align="center" style="padding:20px 16px 18px 16px;">
                  <div style="font-family:'Courier New',Courier,monospace;font-size:32px;font-weight:700;color:#141217;letter-spacing:6px;line-height:1.2;">{{CODE}}</div>
                  <div style="padding-top:8px;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:12px;color:#8a6a4d;">{{EXPIRY}}</div>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- 요청 안 한 경우 -->
        <tr>
          <td style="padding:20px 32px 0 32px;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:13px;color:#8a8a92;line-height:1.7;">
            {{NOTICE}}
          </td>
        </tr>

        <!-- 구분선 -->
        <tr>
          <td style="padding:24px 32px 0 32px;">
            <div style="height:1px;background:#eeeef0;line-height:1px;font-size:0;">&nbsp;</div>
          </td>
        </tr>

        <!-- 꼬리말 -->
        <tr>
          <td style="padding:16px 32px 28px 32px;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:12px;color:#a0a0a8;line-height:1.7;">
            이 메일은 발신 전용입니다. 답장하셔도 확인하지 못합니다.<br>
            <a href="https://hapjugak.com" style="color:#c2792f;text-decoration:none;">hapjugak.com</a>
          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>
</body>
</html>
