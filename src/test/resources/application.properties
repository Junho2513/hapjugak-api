spring.datasource.url=jdbc:mysql://localhost:3306/hapjugak_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# 테스트도 운영과 똑같이 "Flyway가 만든 스키마" 위에서 돕니다.
# 마이그레이션이 엔티티와 어긋나면 배포 전에 CI에서 먼저 터집니다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# 테스트 DB는 비어 있어야 합니다. 기준선 처리 없이 V1부터 진짜로 실행합니다.
spring.flyway.baseline-on-migrate=false

# 테스트는 S3를 호출하지 않지만, 빈을 만들 때 이 값들이 필요합니다.
# 없으면 애플리케이션 컨텍스트가 아예 안 뜹니다.
app.s3.bucket=test-bucket
app.s3.region=ap-southeast-2
app.s3.public-base-url=https://test-bucket.s3.ap-southeast-2.amazonaws.com
app.s3.presign-minutes=5

jwt.secret=test-only-secret-key-for-hapjugak-integration-tests-32bytes
jwt.expiration-minutes=120

google.client-id=test-client-id
# 테스트는 구글을 호출하지 않지만, 빈을 만들 때 값이 있어야 합니다.
google.client-secret=test-client-secret

# 테스트는 메일을 보내지 않지만, 빈을 만들 때 값이 있어야 합니다.
app.mail.region=ap-southeast-2
app.mail.from-address=noreply@test.invalid
app.mail.logo-url=https://test-bucket.s3.ap-southeast-2.amazonaws.com/brand/logo.png

# 테스트는 카카오·네이버를 호출하지 않지만, 빈을 만들 때 값이 있어야 합니다.
kakao.client-id=test-kakao-id
kakao.client-secret=test-kakao-secret
kakao.redirect-uri=https://test.invalid/oauth.html
naver.client-id=test-naver-id
naver.client-secret=test-naver-secret
